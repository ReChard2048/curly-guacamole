<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CSP-J 知识树</title>
<style>
:root{
  --bg:#0b1020; --card:#161f3d; --card2:#1d2750; --line:#2a3765;
  --text:#e8ecf8; --muted:#8e9ac4; --accent:#5ee7ff; --accent2:#ff7ac8;
  --ok:#4ade80; --bad:#ff6b81; --warn:#ffd166;
  --radius:14px;
  --font:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Code",Consolas,"JetBrains Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(1200px 620px at 8% -12%,#1b2755 0%,var(--bg) 58%) fixed,var(--bg);
  color:var(--text);font-family:var(--font);line-height:1.6;
  display:flex;flex-direction:column;
}
button{font-family:inherit;cursor:pointer}
header{
  padding:14px 18px;border-bottom:1px solid var(--line);
  background:rgba(11,16,32,.72);backdrop-filter:blur(8px);
  position:sticky;top:0;z-index:20;
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;
}
h1{font-size:17px;margin:0;letter-spacing:.5px}
h1 small{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.chip{
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:3px 11px;font-size:12px;color:var(--muted);white-space:nowrap;
}
.chip b{color:var(--accent);font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  background:var(--card);border:1px solid var(--line);color:var(--text);
  border-radius:9px;padding:5px 11px;font-size:12.5px;transition:.15s;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,#2a6df5,#5ee7ff);border-color:transparent;color:#04121f;font-weight:700}
.btn.primary:hover{filter:brightness(1.1);color:#04121f}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}

main{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.15fr);gap:16px;padding:16px;flex:1;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.panel h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600;letter-spacing:.5px}

/* ---------- tree ---------- */
#treeWrap{max-height:calc(100vh - 150px);overflow:auto}
ul.tree,ul.tree ul{list-style:none;margin:0;padding:0}
ul.tree ul{margin-left:13px;padding-left:13px;border-left:1px dashed var(--line)}
li{margin:2px 0}
.node{
  display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:9px;
  border:1px solid transparent;cursor:pointer;transition:.15s;
}
.node:hover{background:var(--card2)}
.node.active{border-color:var(--accent);background:var(--card2)}
.node.locked{opacity:.45;cursor:not-allowed}
.node.locked:hover{background:transparent}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:#3a4470}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.part{background:var(--warn)}
.dot.ready{background:var(--accent)}
.nname{font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nw{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.bar{width:44px;height:5px;border-radius:3px;background:#2a3459;overflow:hidden;flex:0 0 auto}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--ok));width:0}
.tag{font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);flex:0 0 auto}
.tag.h{color:var(--accent2);border-color:#5a2a53}
.tag.nobank{color:var(--warn);border-color:#5a4a2a}

/* ---------- detail ---------- */
.crumb{font-size:11.5px;color:var(--muted);margin-bottom:6px}
#detailTitle{font-size:19px;margin:0 0 4px}
.desc{color:var(--muted);font-size:13px;margin:0 0 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin-bottom:12px}
.kv span:nth-child(odd){color:var(--muted)}
.meter{height:9px;border-radius:5px;background:#2a3459;overflow:hidden;margin:6px 0 12px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--ok));width:0;transition:.35s}
.rowbtn{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.hint{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.hint.warn{border-color:var(--warn);color:var(--warn)}
.hint.bad{border-color:var(--bad);color:var(--bad)}
.radio{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin:8px 0 0}
select{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-family:inherit;font-size:12.5px}

/* ---------- exam ---------- */
.examTop{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.examTop b{color:var(--accent)}
.stem{font-size:14.5px;margin:10px 0}
.code{
  font-family:var(--mono);font-size:12.5px;background:#080d1c;border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;overflow:auto;white-space:pre;margin:10px 0;color:#c8e1ff;
}
.opt{
  display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;margin:7px 0;font-size:13.5px;transition:.13s;background:#131c38;
}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:#16294d}
.opt.right{border-color:var(--ok);background:#122a1f}
.opt.wrong{border-color:var(--bad);background:#2c1520}
.opt .k{
  flex:0 0 20px;height:20px;border-radius:6px;background:#26325c;color:var(--muted);
  font-size:11.5px;display:grid;place-items:center;font-family:var(--mono)
}
.opt.sel .k{background:var(--accent);color:#04121f}
.examActions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.score{font-size:34px;font-weight:800;letter-spacing:1px}
.score.ok{color:var(--ok)}
.score.bad{color:var(--bad)}
.reviewItem{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin:9px 0;background:#131c38}
.reviewItem .rh{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:6px}
.pill{font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:#245c39}
.pill.bad{color:var(--bad);border-color:#5c2431}
.ans{font-size:13px;margin-top:5px}
.ans b{color:var(--accent)}
.exp{font-size:12.5px;color:var(--muted);margin-top:6px;border-left:2px solid var(--line);padding-left:9px}

.banner{margin:0;padding:10px 18px;background:#3a2a12;color:var(--warn);font-size:13px;border-bottom:1px solid #5a4a2a}
#toast{
  position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--card2);border:1px solid var(--line);padding:9px 16px;border-radius:11px;
  font-size:13px;transition:.25s;z-index:50;max-width:80vw
}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <h1 id="title">CSP-J 知识树<small id="subtitle"></small></h1>
  <div class="chips">
    <span class="chip">已通过 <b id="statPassed">0/0</b></span>
    <span class="chip">平均掌握 <b id="statAvg">0%</b></span>
  </div>
  <div class="tools">
    <button class="btn" id="btnReload" title="重新读取 tree.json 与所有题库">重新加载</button>
    <button class="btn" id="btnExport">导出进度</button>
    <button class="btn" id="btnImport">导入进度</button>
    <button class="btn" id="btnReset">重置进度</button>
    <input type="file" id="fileImport" accept="application/json" hidden />
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<main>
  <section class="panel">
    <h2>知识树</h2>
    <div id="treeWrap"><ul class="tree" id="tree"></ul></div>
  </section>
  <section class="panel" id="detail"></section>
</main>

<div id="toast"></div>

        \"id\": \"memo-search\",\n        \"name\": \"记忆化搜索\",\n        \"desc\": \"搜索与 DP 的桥接，状态定义与转移。\",\n        \"children\": []\n      }\n    ]\n  },\n  {\n    \"id\": \"dp-more\",\n    \"name\": \"动态规划进阶\",\n    \"desc\": \"背包、线性 DP、区间 DP、树形 DP 入门。\",\n    \"children\": [\n      {\n        \"id\": \"knapsack\",\n        \"name\": \"背包问题\",\n        \"desc\": \"01 背包、完全背包、多重背包、分组背包。\",\n        \"children\": []\n      },\n      {\n        \"id\": \"linear-dp\",\n        \"name\": \"线性 DP\",\n        \"desc\": \"最长上升子序列、最大子段和、数字三角形。\",\n        \"children\": []\n      },\n      {\n        \"id\": \"interval-dp\",\n        \"name\": \"区间 DP\",\n        \"desc\": \"区间合并、石子合并、括号匹配。\",\n        \"children\": []\n      },\n      {\n        \"id\": \"tree-dp\",\n        \"name\": \"树形 DP 入门\",\n        \"desc\": \"树上背包、树的直径与重心、换根 DP 入门。\",\n        \"children\": []\n      }\n    ]\n  }\n    ]\n  }\n}\n","bank/basics-operators.json":"{\n  \"id\": \"basics-operators\",\n  \"name\": \"运算符与表达式\",\n  \"desc\": \"第二个样板节点：10 道公开题 + 4 道隐藏题，用来看「通过后解锁子节点」的效果。\",\n  \"visible\": [\n    {\n      \"id\": \"v01\",\n      \"type\": \"single\",\n      \"q\": \"表达式 7 % 3 的值是？\",\n      \"options\": [\"1\", \"2\", \"2.33\", \"0\"],\n      \"answer\": 0,\n      \"explain\": \"% 是取余，7 = 3*2 + 1，余数是 1。\"\n    },\n    {\n      \"id\": \"v02\",\n      \"type\": \"single\",\n      \"q\": \"两个 int 变量 a=5、b=2，表达式 a / b 的值是？\",\n      \"options\": [\"2.5\", \"2\", \"3\", \"2.0\"],\n      \"answer\": 1,\n      \"explain\": \"整数整除，结果仍是 int，小数被截掉。\"\n    },\n    {\n      \"id\": \"v03\",\n      \"type\": \"judge\",\n      \"q\": \"== 是赋值运算符。\",\n      \"answer\": false,\n      \"explain\": \"== 是关系运算符（判断相等），= 才是赋值。写反了编译器不报错，最容易埋雷。\"\n    },\n    {\n      \"id\": \"v04\",\n      \"type\": \"single\",\n      \"q\": \"表达式 2 + 3 * 4 的值是？\",\n      \"options\": [\"20\", \"14\", \"24\", \"11\"],\n      \"answer\": 1,\n      \"explain\": \"* 优先级高于 +，先算 3*4=12，再加 2 得 14。\"\n    },\n    {\n      \"id\": \"v05\",\n      \"type\": \"multi\",\n      \"q\": \"下列哪些是关系运算符？\",\n      \"options\": [\"<\", \">=\", \"&&\", \"==\"],\n      \"answer\": [0, 1, 3],\n      \"explain\": \"&& 是逻辑运算符，不是关系运算符。\"\n    },\n    {\n      \"id\": \"v06\",\n      \"type\": \"single\",\n      \"q\": \"执行 a = 5; b = a++; 之后，b 的值是？\",\n      \"options\": [\"5\", \"6\", \"4\", \"未定义\"],\n      \"answer\": 0,\n      \"explain\": \"后置 ++ 先用旧值：b 拿到 5，a 自己变成 6。\"\n    },\n    {\n      \"id\": \"v07\",\n      \"type\": \"single\",\n      \"q\": \"执行 a = 5; b = ++a; 之后，b 的值是？\",\n      \"options\": [\"5\", \"6\", \"4\", \"未定义\"],\n      \"answer\": 1,\n      \"explain\": \"前置 ++ 先自增：a 先变 6，b 再拿到 6。\"\n    },\n    {\n      \"id\": \"v08\",\n      \"type\": \"judge\",\n      \"q\": \"C++ 中逻辑非 !0 的值是 1（真）。\",\n      \"answer\": true,\n      \"explain\": \"非 0 即真，!0 得到 1；注意 !5 会得到 0，不是 5。\"\n    },\n    {\n      \"id\": \"v09\",\n      \"type\": \"single\",\n      \"q\": \"表达式 (3 > 2) && (1 > 2) 的值是？\",\n      \"options\": [\"1\", \"0\", \"true 和 false\", \"无法判断\"],\n      \"answer\": 1,\n      \"explain\": \"&& 要求两边都真，右边 1>2 假，整体为假（0）。\"\n    },\n    {\n      \"id\": \"v10\",\n      \"type\": \"single\",\n      \"q\": \"阅读以下程序，输出的结果是？\",\n      \"code\": \"int a = 10;\\na %= 3;\\ncout << a;\",\n      \"options\": [\"1\", \"3\", \"3.33\", \"0\"],\n      \"answer\": 0,\n      \"explain\": \"a %= 3 等价于 a = a % 3 = 1。\"\n    }\n  ],\n  \"hidden\": [\n    {\n      \"id\": \"h01\",\n      \"type\": \"single\",\n      \"q\": \"表达式 1 << 3 的值是？\",\n      \"options\": [\"3\", \"8\", \"6\", \"16\"],\n      \"answer\": 1,\n      \"explain\": \"左移 3 位等于乘 2^3 = 8。\"\n    },\n    {\n      \"id\": \"h02\",\n      \"type\": \"multi\",\n      \"q\": \"下列哪些表达式的结果为真（非 0）？\",\n      \"options\": [\"3 & 1\", \"3 | 4\", \"0 || 5\", \"!5\"],\n      \"answer\": [0, 1, 2],\n      \"explain\": \"3&1=1 真，3|4=7 真，0||5 真，!5=0 假。\"\n    },\n    {\n      \"id\": \"h03\",\n      \"type\": \"judge\",\n      \"q\": \"x += 1 和 x = x + 1 的效果基本等价。\",\n      \"answer\": true,\n      \"explain\": \"复合赋值就是简写，只是求值次数上有细微差别。\"\n    },\n    {\n      \"id\": \"h04\",\n      \"type\": \"single\",\n      \"q\": \"阅读以下程序，输出的结果是？\",\n      \"code\": \"int x = 5;\\ncout << x++ << \\\" \\\" << x;\",\n      \"options\": [\"5 5\", \"5 6\", \"6 5\", \"6 6\"],\n      \"answer\": 1,\n      \"explain\": \"x++ 先输出 5 再自增，所以后面那个 x 已经是 6。\"\n    }\n  ]\n}\n","bank/basics-variables.json":"{\n  \"id\": \"basics-variables\",\n  \"name\": \"变量与数据类型\",\n  \"desc\": \"样板题库：12 道公开题 + 6 道隐藏题，四种题型都覆盖了。\",\n  \"visible\": [\n    {\n      \"id\": \"v01\",\n      \"type\": \"single\",\n      \"q\": \"在主流 32/64 位平台上，int 一般占几个字节？\",\n      \"options\": [\"1\", \"2\", \"4\", \"8\"],\n      \"answer\": 2,\n      \"explain\": \"int 通常 4 字节，范围约 -2147483648 ~ 2147483647。\"\n    },\n    {\n      \"id\": \"v02\",\n      \"type\": \"single\",\n      \"q\": \"下面哪个是合法的 C++ 变量名？\",\n      \"options\": [\"2sum\", \"_sum\", \"sum-1\", \"int\"],\n      \"answer\": 1,\n      \"explain\": \"变量名由字母、数字、下划线组成，不能以数字开头，也不能用关键字。\"\n    },\n    {\n      \"id\": \"v03\",\n      \"type\": \"single\",\n      \"q\": \"char 类型占几个字节？\",\n      \"options\": [\"1\", \"2\", \"4\", \"8\"],\n      \"answer\": 0,\n      \"explain\": \"sizeof(char) 按标准恒为 1，其他类型都是它的整数倍。\"\n    },\n    {\n      \"id\": \"v04\",\n      \"type\": \"multi\",\n      \"q\": \"下列哪些属于 C++ 的内置数值类型？\",\n      \"options\": [\"int\", \"char\", \"float\", \"string\"],\n      \"answer\": [0, 1, 2],\n      \"explain\": \"string 是标准库里的类类型，不是内置的。\"\n    },\n    {\n      \"id\": \"v05\",\n      \"type\": \"judge\",\n      \"q\": \"C++ 里变量必须先声明（定义）之后才能使用。\",\n      \"answer\": true,\n      \"explain\": \"C++ 是静态类型语言，编译器得先知道类型才能分配空间、检查运算。\"\n    },\n    {\n      \"id\": \"v06\",\n      \"type\": \"single\",\n      \"q\": \"大多数实现里 bool 占几个字节？\",\n      \"options\": [\"1\", \"2\", \"4\", \"8\"],\n      \"answer\": 0,\n      \"explain\": \"sizeof(bool) 一般是 1，取值只有 true / false。\"\n    },\n    {\n      \"id\": \"v07\ ain\": \"int 上限是 2147483647；再加 1 就溢出，更大的整数得用 long long。\"\n    },\n    {\n      \"id\": \"h03\",\n      \"type\": \"single\",\n      \"q\": \"C++ 标准规定 sizeof(char) 的值是多少？\",\n      \"options\": [\"1\", \"2\", \"取决于平台\", \"标准未规定\"],\n      \"answer\": 0,\n      \"explain\": \"字节数本来就是按 char 定义的，所以 sizeof(char) 恒为 1。\"\n    },\n    {\n      \"id\": \"h04\",\n      \"type\": \"judge\",\n      \"q\": \"C++ 标准保证 short 不大于 int，int 不大于 long long。\",\n      \"answer\": true,\n      \"explain\": \"这是标准的顺序保证，具体字节数才是平台相关的。\"\n    },\n    {\n      \"id\": \"h05\",\n      \"type\": \"multi\",\n      \"q\": \"下列哪些是 C++ 的关键字？\",\n      \"options\": [\"int\", \"main\", \"const\", \"while\"],\n      \"answer\": [0, 2, 3],\n      \"explain\": \"main 是函数名，只是被规定为程序入口，不是关键字。\"\n    },\n    {\n      \"id\": \"h06\",\n      \"type\": \"single\",\n      \"q\": \"阅读以下程序，输出的结果是？\",\n      \"code\": \"char c = 'a' + 1;\\ncout << c;\",\n      \"options\": [\"a\", \"b\", \"98\", \"'a'+1\"],\n      \"answer\": 1,\n      \"explain\": \"字符按 ASCII 参与运算，'a' 是 97，加 1 得 98，存回 char 输出就是 b。\"\n    }\n  ]\n}\n","bank/bidirectional-search.json":"{\n  \"id\": \"bidirectional-search\",\n  \"name\": \"双向搜索\",\n  \"desc\": \"Meet in the Middle、双向 BFS。\",\n  \"visible\": [\n    {\n      \"id\": \"v01\",\n      \"type\": \"single\",\n      \"q\": \"双向 BFS 的核心思想是？\",\n      \"options\": [\n        \"从起点和终点同时搜索\",\n        \"只从起点搜索\",\n        \"只从终点搜索\",\n        \"随机搜索\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"两边扩展，相遇时得到最短路径。\"\n    },\n    {\n      \"id\": \"v02\",\n      \"type\": \"judge\",\n      \"q\": \"Meet in the Middle 常用于缩小指数级枚举规模。\",\n      \"answer\": true,\n      \"explain\": \"把问题分成两半，分别枚举后合并。\"\n    },\n    {\n      \"id\": \"v03\",\n      \"type\": \"single\",\n      \"q\": \"双向 BFS 相比单向 BFS，通常能？\",\n      \"options\": [\n        \"减少搜索状态数\",\n        \"增加状态数\",\n        \"降低正确性\",\n        \"增加边权\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"两边扩展，分支因子降低。\"\n    },\n    {\ log2(len))\",\n        \"len\",\n        \"len / 2\",\n        \"ceil(len / 2)\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"用两个长度为 2^k 的区间覆盖查询区间。\"\n    },\n    {\n      \"id\": \"v06\",\n      \"type\": \"judge\",\n      \"q\": \"倍增只能用于求最值，不能用于求祖先。\",\n      \"answer\": false,\n      \"explain\": \"树上倍增常用于求第 k 个祖先和 LCA。\"\n    },\n    {\n      \"id\": \"v07\",\n      \"type\": \"single\",\n      \"q\": \"快速幂中，若当前指数二进制位为 1，则？\",\n      \"options\": [\n        \"把当前底数乘入答案\",\n        \"跳过\",\n        \"底数除以 2\",\n        \"指数加 1\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"二进制位为 1 表示该 2^k 次幂需要计入结果。\"\n    },\n    {\n      \"id\": \"v08\",\n      \"type\": \"judge\",\n      \"q\": \"ST 表不支持修改操作。\",\n      \"answer\": true,\n      \"explain\": \"ST 表适用于静态数据，修改后需要重新预处理。\"\n    },\n    {\n      \"id\": \"v09\",\n      \"type\": \"single\",\n      \"q\": \"树上倍增求 LCA 时，通常先让较深的节点跳到？\",\n      \"options\": [\n        \"与较浅节点同深度\",\n        \"根节点\",\n        \"叶子节点\",\n        \"任意节点\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"先统一深度，再一起向上跳。\"\n    },\n    {\n      \"id\": \"v10\",\n      \"type\": \"judge\",\n      \"q\": \"倍增思想可以把 O(n) 的逐次跳跃优化到 O(log n)。\",\n      \"answer\": true,\n      \"explain\": \"把 n 拆成二进制后，只需 log n 次跳跃。\"\n    }\n  ],\n  \"hidden\": [\n    {\n      \"id\": \"h01\",\n      \"type\": \"single\",\n      \"q\": \"ST 表预处理的时间复杂度是？\",\n      \"options\": [\n        \"O(n log n)\",\n        \"O(n)\",\n        \"O(n^2)\",\n        \"O(log n)\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"每个位置往右跳 2^k 步，共 log n 层，每层 O(n)。\"\n    },\n    {\n      \"id\": \"h02\",\n      \"type\": \"single\",\n      \"q\": \"ST 表单次区间最值查询的时间复杂度是？\",\n      \"options\": [\n        \"O(1)\",\n        \"O(log n)\",\n        \"O(n)\",\n        \"O(n log n)\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"两个重叠区间覆盖即可。\"\n    },\n    {\n      \"id\": \"h03\",\n      \"type\": \"judge\",\n      \"q\": \"树上倍增可以用于求最近公共祖先。\",\n      \"answer\": true,\n      \"explain\": \"预处理每个点向上 2^k 的祖先，查询时倍增跳。\"\n    },\n    {\n      \"id\": \"h04\",\n      \"type\": \"single\",\n      \"q\": \"快速幂计算 a^b mod p 时，每次循环通常做什么？\",\n      \"options\": [\n        \"底数平方，指数右移一位\",\n        \"底数加一\",\n        \"指数平方\",\n        \"答案乘 b\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"按二进制从低到高处理，底数不断平方。\"\n    },\n    {\n      \"id\": \"h05\",\n      \"type\": \"judge\",\n      \"q\": \"倍增法一定比非倍增法代码更短。\",\n      \"answer\": false,\n      \"explain\": \"倍增通常需要预处理，代码不一定更短，但复杂度更优。\"\n    }\n  ]\n}\n","bank/dfs-pruning.json":"{\n  \"id\": \"dfs-pruning\",\n  \"name\": \"DFS 剪枝\",\n  \"desc\": \"可行性剪枝、最优性剪枝、搜索顺序优化。\",\n  \"visible\": [\n    {\n      \"id\": \"v01\",\n      \"type\": \"single\",\n      \"q\": \"DFS 剪枝的主要目的是？\",\n      \"options\": [\n        \"减少无效搜索分支\",\n        \"增加搜索深度\",\n        \"增加状态数\",\n        \"排序\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"提前排除不可能或不可能更优的分支。\"\n    },\n    {\n      \"id\": \"v02\",\n      \"type\": \"judge\",\n      \"q\": \"可行性剪枝是判断当前状态是否还能达到目标。\",\n      \"answer\": true,\n      \"explain\": \"若不可能，则直接回溯。\"\n    },\n    {\n      \"id\": \"v03\",\n      \"type\": \"single\",\n      \"q\": \"最优性剪枝通常用于？\",\n      \"options\": [\n        \"最优化问题\",\n        \"计数问题\",\n        \"排序问题\",\n        \"字符串匹配\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"若当前代价已超过已知最优，则剪枝。\"\n    },\n    {\n      \"id\": \"v04\",\n      \"type\": \"judge\",\n      \"q\": \"搜索顺序优化可以影响剪枝效果。\",\n      \"answer\": true,\n      \"explain\": \"先搜约束强的分支，能更早剪枝。\"\n    },\n    {\n      \"id\": \"v05\",\n      \"type\": \"single\",\n      \"q\": \"在 DFS 中，剪枝通常放在？\",\n      \"options\": [\n        \"进入分支前\",\n        \"回溯后\",\n        \"输出答案后\",\n        \"程序结束时\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"提前判断，避免进入无用分支。\"\n    },\n    {\n      \"id\": \"v06\",\n      \"type\": \"judge\",\n      \"q\": \"只要剪掉的分支确实不可能产生最优解，剪枝就不会影响正确性。\",\n      \"answer\": true,\n      \"explain\": \"正确的剪枝只去掉不可能的分支，所以不影响正确性；但剪枝设计错了会剪掉正解，所以题干里那个前提不能省。\"\n    },\n    {\n      \"id\": \"v07\",\n      \"type\": \"single\",\n      \"q\": \"若当前已选和加上剩余最大可能和仍小于目标，则？\",\n      \"options\": [\n        \"可行性剪枝\",\n        \"最优性剪枝\",\n        \"不剪枝\",\n        \"排序\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"无法达到目标，剪掉。\"\n    },\n    {\n      \"id\": \"v08\",\n      \"type\": \"judge\",\n      \"q\": \"记忆化搜索可以看作一种剪枝。\",\n      \"answer\": true,\n      \"explain\": \"重复状态只计算一次。\"\n    },\n    {\n      \"id\": \"v09\",\n      \"type\": \"single\",\n      \"q\": \"DFS 剪枝中，上下界估计常用于？\",\n      \"options\": [\n        \"最优性剪枝\",\n        \"可行性剪枝\",\n        \"去重\",\n        \"排序\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"估计当前分支能否优于已知最优。\"\n    },\n    {\n      \"id\": \"v10\",\n      \"type\": \"judge\",\n      \"q\": \"剪枝越强越好，且总能容易找到。\",\n      \"answer\": false,\n      \"explain\": \"强剪枝需要问题性质，设计有难度。\"\n    }\n  ],\n  \"hidden\": [\n    {\n      \"id\": \"h01\",\n      \"type\": \"single\",\n      \"q\": \"DFS 搜索中，若当前花费已经大于已知最优解，应该？\",\n      \"options\": [\n        \"最优性剪枝\",\n        \"继续搜索\",\n        \"输出答案\",\n        \"回溯到根\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"不可能更优，剪掉。\"\n    },\n    {\n      \"id\": \"h02\",\n      \"type\": \"judge\",\n      \"q\": \"搜索顺序优化可以更早找到较优解，从而增强最优性剪枝。\",\n      \"answer\": true,\n      \"explain\": \"先搜可能更优的分支。\"\n    },\n    {\n      \"id\": \"h03\",\n      \"type\": \"single\",\n      \"q\": \"可行性剪枝通常基于？\",\n      \"options\": [\n        \"约束条件\",\n        \"最优解\",\n        \"随机\",\n        \"排序\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"违反约束或不可能满足约束时剪掉。\"\n    },\n    {\n      \"id\": \"h04\",\n      \"type\": \"single\",\n      \"q\": \"在组合搜索中，去重剪枝常用于？\",\n      \"options\": [\n        \"避免相同状态重复搜索\",\n        \"增加分支\",\n        \"增加深度\",\n        \"排序\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"例如排序后限制相同元素的选择顺序。\"\n    },\n    {\n      \"id\": \"h05\",\n      \"type\": \"judge\",\n      \"q\": \"好的剪枝可以大幅降低搜索树规模。\",\n      \"answer\": true,\n      \"explain\": \"剪枝是 DFS 优化的重要手段。\"\n    }\n  ]\n}\n","bank/ds-tree-basic.json":"{\n  \"id\": \"ds-tree-basic\",\n  \"name\": \"树的基本概念与存储\",\n  \"desc\": \"度数、深度、叶子；三种表示法；二叉树的性质与编号。\",\n  \"visible\": [\n    {\n      \"id\": \"v01\",\n      \"type\": \"judge\",\n      \"q\": \"一棵有 n 个节点的树恰好有 n-1 条边。\",\n      \"answer\": true,\n      \"explain\": \"树是连通且无环的，每加一个点恰好接一条边，所以边数恒为 n-1。\"\n    },\n    {\n      \"id\": \"v02\",\n      \"type\": \"single\",\n      \"q\": \"在任意一棵二叉树中，叶子节点数 n0 和度为 2 的节点数 n2 满足？\",\n      \"options\": [\"n0 = n2 + 1\", \"n0 = n2\", \"n0 = n2 - 1\", \"n0 = 2 * n2\"],\n      \"answer\": 0,\n      \"explain\": \"由度数之和等于边数可推出 n0 = n2 + 1，这是二叉树最经典的性质。\"\n    },\n    {\n      \"id\": \"v03\",\n      \"type\": \"single\",\n      \"q\": \"完全二叉树用数组存储、下标从 1 开始时，节点 i 的左孩子下标是？\",\n      \"options\": [\"2i\", \"2i + 1\", \"i / 2\", \"i + 1\"],\n      \"answer\": 0,\n      \"explain\": \"左孩子 2i，右孩子 2i+1，父亲 floor(i/2)。编号从 0 开始则分别是 2i+1、2i+2、floor((i-1)/2)。\"\n    },\n    {\n      \"id\": \"v04\",\n      \"type\": \"single\",\n      \"q\": \"孩子兄弟表示法中，一个节点的两个指针分别指向？\",\n      \"options\": [\n        \"左：第一个孩子；右：下一个兄弟\",\n        \"左：父亲；右：第一个孩子\",\n        \"左：最大孩子；右：最小兄弟\",\n        \"左 / 右：任意两个孩子\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"「左孩子右兄弟」。一般树用这种方式就能存成二叉树，这是树转二叉树的原理。\"\n    },\n    {\n      \"id\": \"v05\",\n      \"type\": \"single\",\n      \"q\": \"深度为 h 的二叉树最多有多少个节点？（根节点深度记为 1）\",\n      \"options\": [\"2^h - 1\", \"2^h\", \"2^(h-1)\", \"2h - 1\"],\n      \"answer\": 0,\n      \"explain\": \"每层最多排满：1 + 2 + 4 + … + 2^(h-1) = 2^h - 1。这就是满二叉树。\"\n    },\n    {\n      \"id\": \"v06\",\n      \"type\": \"judge\",\n      \"q\": \"树中任意两个节点之间有且仅有一条简单路径。\",\n      \"answer\": true,\n      \"explain\": \"连通保证至少有一条，无环保证最多只有一条。这是树最重要的结构性质，也是树上 DFS 能成立的前提。\"\n    },\n    {\n      \"id\": \"v07\",\n      \"type\": \"single\",\n      \"q\": \"一棵完全二叉树有 n 个节点，它的叶子节点个数是？\",\n      \"options\": [\"ceil(n / 2)\", \"floor(n / 2)\", \"n / 2 向上取整再减一\", \"n - 1\"],\n      \"answer\": 0,\n      \"explain\": \"编号大于 floor(n/2) 的都是叶子，个数是 n - floor(n/2) = ceil(n/2)。\"\n    },\n    {\n      \"id\": \"v08\",\n      \"type\": \"multi\",\n      \"q\": \"下列哪些是存储一棵树的常见表示法？\",\n      \"options\": [\"双亲表示法\", \"孩子表示法\", \"孩子兄弟表示法\", \"优先队列表示法\"],\n      \"answer\": [0, 1, 2],\n      \"explain\": \"前三种都是正经的树存储结构。优先队列是「取值最大/最小的工具」，不是树的表示法。\"\n    },\n    {\n      \"id\": \"v09\",\n      \"type\": \"single\",\n      \"q\": \"一棵完全二叉树用数组存、编号从 1 到 15，节点 6 的右孩子编号是？\",\n      \"options\": [\"13\", \"12\", \"11\", \"7\"],\n      \"answer\": 0,\n      \"explain\": \"右孩子是 2i+1 = 2×6+1 = 13，左孩子是 12。15 以内都存在。\"\n    },\n    {\n      \"id\": \"v10\",\n      \"type\": \"single\",\n      \"q\": \"一棵二叉树里有 10 个度为 2 的节点、5 个度为 1 的节点，那么叶子节点有多少个？\",\n      \"options\": [\"11\", \"10\", \"15\", \"6\"],\n      \"answer\": 0,\n      \"explain\": \"n0 = n2 + 1 = 11，和度为 1 的节点数无关。\"\n    }\n  ],\n  \"hidden\": [\n    {\n      \"id\": \"h01\",\n      \"type\": \"judge\",\n      \"q\": \"在完全二叉树中，如果某个节点有右孩子，那它一定有左孩子。\",\n      \"answer\": true,\n      \"explain\": \"完全二叉树是「按层从左往右」填满的，不可能出现某个位置空着而更右边有节点的情况。\"\n    },\n    {\n      \"id\": \"h02\",\n      \"type\": \"single\",\n      \"q\": \"n 个节点的完全二叉树，高度是？（根节点高度记为 1）\",\n      \"options\": [\"floor(log2 n) + 1\", \"ceil(log2 n)\", \"log2 n\", \"floor(log2 n)\"],\n      \"answer\": 0,\n      \"explain\": \"比如 n=1 高度 1，n=2、3 高度 2，n=4~7 高度 3。代入公式都成立。\"\n    },\n    {\n      \"id\": \"h03\",\n      \"type\": \"multi\",\n      \"q\": \"关于二叉树的性质，下列说法正确的有？\",\n      \"options\": [\n        \"第 i 层最多有 2^(i-1) 个节点\",\n        \"深度为 h 的二叉树最多有 2^h - 1 个节点\",\n        \"任意二叉树中 n0 = n2 + 1\",\n        \"二叉树的每个节点度数都必须是 2\"\n      ],\n      \"answer\": [0, 1, 2],\n      \"explain\": \"二叉树的节点度数可以是 0、1、2，叶子就是度 0 的节点。\"\n    },\n    {\n      \"id\": \"h04\",\n      \"type\": \"single\",\n      \"q\": \"完全二叉树数组存储、下标从 1 开始，节点 i 的父节点下标是？\",\n      \"options\": [\"floor(i / 2)\", \"i - 1\", \"ceil(i / 2)\", \"i / 2 且要求 i 为偶数\"],\n      \"answer\": 0,\n      \"explain\": \"孩子是 2i 和 2i+1，反过来父亲就是 floor(i/2)。根节点（i=1）算出来是 0，按不存在处理。\"\n    },\n    {\n      \"id\": \"h05\",\n      \"type\": \"judge\",\n      \"q\": \"一般树（不是二叉树）也能用孩子兄弟表示法转成二叉树来存。\",\n      \"answer\": true,\n      \"explain\": \"「左孩子右兄弟」把任意多叉的树映射成二叉树，这是树转二叉树的通用手段。\"\n    }\n  ]\n}\n","bank/ds-tree-bst.json":"{\n  \"id\": \"ds-tree-bst\",\n  \"name\": \"二叉搜索树 BST\",\n  \"desc\": \"性质、查找插入删除，以及它为什么会退化。\",\n  \"visible\": [\n    {\n      \"id\": \"v01\",\n      \"type\": \"single\",\n      \"q\": \"二叉搜索树的核心性质是？\",\n      \"options\": [\n        \"左子树上所有节点的值都小于根，右子树上所有节点的值都大于根\",\n        \"每个节点都有两个孩子\",\n        \"树的高度不超过 log n\",\n        \"左右子树高度必须相等\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"注意是「所有节点」而不只是左右孩子，这个性质对每棵子树都递归成立。\"\n    },\n    {\n      \"id\": \"v02\",\n      \"type\": \"single\",\n      \"q\": \"对一棵 BST 做中序遍历，得到的是？\",\n      \"options\": [\"从小到大的有序序列\", \"从大到小的序列\", \"先序序列\", \"和插入顺序相同\"],\n      \"answer\": 0,\n      \"explain\": \"左 < 根 < 右，中序依次访问正好递增。反过来，这个性质也能用来检查一棵树是不是 BST。\"\n    },\n    {\n      \"id\": \"v03\",\n      \"type\": \"single\",\n      \"q\": \"在随机的、比较平衡的 BST 上查找一个元素，平均时间复杂度是？\",\n      \"options\": [\"O(log n)\", \"O(1)\", \"O(n)\", \"O(n log n)\"],\n      \"answer\": 0,\n      \"explain\": \"每比较一次就丢掉一半左右，树高约 log n。前提是树比较平衡。\"\n    },\n    {\n      \"id\": \"v04\",\n      \"type\": \"judge\",\n      \"q\": \"BST 的查找在最坏情况下也是 O(log n)。\",\n      \"answer\": false,\n      \"explain\": \"如果插入顺序是递增的，树退化成一条链，树高变成 n，查找退化为 O(n)。这就是后面要学平衡树的原因。\"\n    },\n    {\n      \"id\": \"v05\",\n      \"type\": \"single\",\n      \"q\": \"依次插入 1、2、3、4、5 到一棵空 BST，得到的树是？\",\n      \"options\": [\"一条右斜链\", \"一条左斜链\", \"一棵完全二叉树\", \"一棵平衡二叉树\"],\n      \"answer\": 0,\n      \"explain\": \"每个新数都比之前所有数大，所以一直往右走，形成右斜链。查找退化成 O(n)。\"\n    },\n    {\n      \"id\": \"v06\",\n      \"type\": \"single\",\n      \"q\": \"删除一个「有两个孩子」的 BST 节点时，常用做法是？\",\n      \"options\": [\n        \"用中序后继（右子树中的最小节点）的值替换它，再删掉那个后继\",\n        \"直接把它和左孩子交换\",\n        \"把它标记为已删除但不真正移除\",\n        \"重建整棵树\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"中序后继是比它大的节点里最小的那个，拿来顶替位置不会破坏 BST 性质。用中序前驱（左子树最大）也一样。\"\n    },\n    {\n      \"id\": \"v07\",\n      \"type\": \"multi\",\n      \"q\": \"BST 能高效支持的操作有？\",\n      \"options\": [\"查找某个值\", \"插入新值\", \"删除某个值\", \"查询区间内所有元素的和（朴素 BST）\"],\n      \"answer\": [0, 1, 2],\n      \"explain\": \"前三个都是 O(树高)。区间求和需要额外维护子树信息，普通 BST 不直接支持，那要上树状数组 / 线段树。\"\n    },\n    {\n      \"id\": \"v08\",\n      \"type\": \"judge\",\n      \"q\": \"同一组数据，按不同顺序插入 BST，得到的树形可能不同。\",\n      \"answer\": true,\n      \"explain\": \"BST 的形状完全由插入顺序决定，这也是为什么随机化插入（或直接用平衡树）很重要。\"\n    },\n    {\n      \"id\": \"v09\",\n      \"type\": \"single\",\n      \"q\": \"阅读以下描述，依次插入 5、3、7、2、4 后的先序遍历序列是？\",\n      \"code\": \"插入顺序: 5 3 7 2 4\",\n      \"options\": [\"5 3 2 4 7\", \"5 3 7 2 4\", \"2 3 4 5 7\", \"5 3 7 4 2\"],\n      \"answer\": 0,\n      \"explain\": \"5 是根；3<5 挂在左，7>5 挂在右；2<3 挂在 3 的左，4 在 3 的右。先序：5 3 2 4 7。\"\n    },\n    {\n      \"id\": \"v10\",\n      \"type\": \"single\",\n      \"q\": \"在 BST {5, 3, 7, 2, 4, 9} 中查找 6，需要比较几次？\",\n      \"options\": [\"2 次\", \"3 次\", \"4 次\", \"找不到，会无限循环\"],\n      \"answer\": 0,\n      \"explain\": \"先和根 5 比：6>5 往右 → 和 7 比：6<7 往左 → 左边为空，判定不存在。共比较 2 次。\"\n    }\n  ],\n  \"hidden\": [\n    {\n      \"id\": \"h01\",\n      \"type\": \"single\",\n      \"q\": \"平衡树（如 AVL、红黑树）存在的根本原因是？\",\n      \"options\": [\n        \"防止 BST 在特殊插入顺序下退化成链，把操作稳定在 O(log n)\",\n        \"平衡树能存更多数据\",\n        \"平衡树的中序遍历不需要递归\",\n        \"平衡树的插入更简单\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"普通 BST 的形状由插入顺序决定，可以很坏。平衡树通过旋转主动维持树高在 O(log n)。\"\n    },\n    {\n      \"id\": \"h02\",\n      \"type\": \"judge\",\n      \"q\": \"BST 中某个节点的中序后继，是它右子树中值最小的那个节点。\",\n      \"answer\": true,\n      \"explain\": \"中序遍历时紧跟在它后面的元素，就是比它大的最小值。若右子树为空，则要往上找第一个「它是其左子树」的祖先。\"\n    },\n    {\n      \"id\": \"h03\",\n      \"type\": \"single\",\n      \"q\": \"已知一棵树的中序序列是 {1,2,3,4,5}，能否据此断定它是 BST？\",\n      \"options\": [\n        \"不能，还得验证每个节点的子树确实满足左小右大\",\n        \"能，中序递增就是 BST 的充要条件\",\n        \"能，只要节点数对了就行\",\n        \"不能，因为中序序列总是递增的\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"中序递增只是 BST 的必要条件。任何树只要按中序访问恰好递增，还得再确认左右分区真的符合左小右大。\"\n    },\n    {\n      \"id\": \"h04\",\n      \"type\": \"multi\",\n      \"q\": \"关于 BST 的插入，下列说法正确的有？\",\n      \"options\": [\n        \"插入过程就是一次失败的查找路径，在末端挂上新节点\",\n        \"插入不会改变已有节点的父子关系\",\n        \"插入后中序序列仍然递增\",\n        \"插入可能需要旋转才能维持 BST 性质\"\n      ],\n      \"answer\": [0, 1, 2],\n      \"explain\": \"普通 BST 的插入不需要旋转，只需要找到空位置挂上去。旋转是平衡树的概念。\"\n    },\n    {\n      \"id\": \"h05\",\n      \"type\": \"single\",\n      \"q\": \"把一组 1..n 按随机顺序插入 BST，期望树高大约是？\",\n      \"options\": [\"O(log n)\", \"O(n)\", \"O(sqrt(n))\", \"O(n log n)\"],\n      \"answer\": 0,\n      \"explain\": \"随机插入的 BST 期望高度是 O(log n)，常数比完全平衡略差。这也是「顺序打乱再插入」这个习惯做法的来由。\"\n    }\n  ]\n}\n","bank/ds-tree-diameter.json":"{\n  \"id\": \"ds-tree-diameter\",\n  \"name\": \"树的直径与重心\",\n  \"desc\": \"两次 DFS 求直径、树形 DP 求直径，以及重心的性质。\",\n  \"visible\": [\n    {\n      \"id\": \"v01\",\n      \"type\": \"single\",\n      \"q\": \"树的直径指的是？\",\n      \"options\": [\n        \"树上距离最远的一对节点之间的距离\",\n        \"树上最长的一条边\",\n        \"树的高度\",\n        \"树的所有边权之和\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"「距离」按题目定义，可能是边数（无向无权树）也可能是边权和（带权树）。\"\n    },\n    {\n      \"id\": \"v02\",\n      \"type\": \"judge\",\n      \"q\": \"两次 DFS（或两次 BFS）就能求出树的直径。\",\n      \"answer\": true,\n      \"explain\": \"第一次从任意点出发找最远点 u，第二次从 u 出发找最远点 v，u 到 v 的距离就是直径。关键是边权必须非负。\"\n    },\n    {\n      \"id\": \"v03\",\n      \"type\": \"single\",\n      \"q\": \"两次 DFS 求直径，第一次 DFS 的起点可以选在哪？\",\n      \"options\": [\n        \"任意一个节点都行\",\n        \"只能是根节点\",\n        \"必须是度数最大的节点\",\n        \"必须是最深的叶子\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"从任意点出发找到的最远点，一定是某条直径的一个端点。这就是这个做法成立的地方。\"\n    },\n    {\n      \"id\": \"v04\",\n      \"type\": \"judge\",\n      \"q\": \"带负权边的树上，两次 DFS 求直径依然正确。\",\n      \"answer\": false,\n      \"explain\": \"负权会让「从起点到最远点」这一步行不通，第一次找到的点未必是直径端点。负权树要用树形 DP。\"\n    },\n    {\n      \"id\": \"v05\",\n      \"type\": \"single\",\n      \"q\": \"用树形 DP 求直径的思路是？\",\n      \"options\": [\n        \"对每个节点，取它往下的最长两条链，加起来更新答案\",\n        \"从根出发做两次 DFS\",\n        \"对每条边求最长路径\",\n        \"用并查集合并子树\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"设 down[u] 为 u 往下走的最长链。对每个 u，用「最长链 + 次长链」拼出一条经过 u 的最长路径，取最大值。\"\n    },\n    {\n      \"id\": \"v06\",\n      \"type\": \"single\",\n      \"q\": \"树的重心是指？\",\n      \"options\": [\n        \"删掉它之后，剩下的连通块中最大块的大小最小的那个点\",\n        \"树的几何中心\",\n        \"度数最大的点\",\n        \"直径路径的中点一定是重心\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"重心让「最大子树」尽可能小，所以它在点分治里是关键：每次从重心切开，子树规模减半。\"\n    },\n    {\n      \"id\": \"v07\",\n      \"type\": \"judge\",\n      \"q\": \"一棵树最多有两个重心。\",\n      \"answer\": true,\n      \"explain\": \"当节点数为偶数、且有一条边正好把树分成大小相等的两半时，那条边的两个端点都是重心。\"\n    },\n    {\n      \"id\": \"v08\",\n      \"type\": \"multi\",\n      \"q\": \"关于重心，下列说法正确的有？\",\n      \"options\": [\n        \"删除重心后，最大连通块的大小不超过 n/2\",\n        \"重心可以通过一次 DFS 求出（比较各子树大小）\",\n        \"树可能有两个重心\",\n        \"重心一定是叶子节点\"\n      ],\n      \"answer\": [0, 1, 2],\n      \"explain\": \"重心通常不是叶子，它更靠近树的「中间」。度数最大的点也未必是重心。\"\n    },\n    {\n      \"id\": \"v09\",\n      \"type\": \"single\",\n      \"q\": \"用树形 DP 求直径的时间复杂度是？\",\n      \"options\": [\"O(n)\", \"O(n log n)\", \"O(n^2)\", \"O(n + m) 其中 m 是边数且 m 很大\"],\n      \"answer\": 0,\n      \"explain\": \"每个节点只被访问一次，更新时只取最大和次大的孩子链。树有 n-1 条边，所以是 O(n)。\"\n    },\n    {\n      \"id\": \"v10\",\n      \"type\": \"single\",\n      \"q\": \"阅读以下描述，这棵树的直径（按边数算）是多少？\",\n      \"code\": \"        1\\n       / \\\\\\n      2   3\\n     / \\\\\\n    4   5\",\n      \"options\": [\"3\", \"4\", \"2\", \"5\"],\n      \"answer\": 0,\n      \"explain\": \"最远的点是 4 或 5 到 3，路径都是 3 条边（4→2→1→3）。所以直径是 3。\"\n    }\n  ],\n  \"hidden\": [\n    {\n      \"id\": \"h01\",\n      \"type\": \"single\",\n      \"q\": \"为什么带负权边时两次 DFS 求直径会失效？\",\n      \"options\": [\n        \"因为「从某点出发的最远点」不再必然落在直径端点上\",\n        \"因为负权会让 DFS 死循环\",\n        \"因为数组下标会变负\",\n        \"因为负权边不合法\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"可以构造出反例：第一次找到的点并不在任何一条最长路径的端点。这时只能用树形 DP 老实枚举。\"\n    },\n    {\n      \"id\": \"h02\",\n      \"type\": \"judge\",\n      \"q\": \"树形 DP 求直径需要同时维护「最长链」和「次长链」。\",\n      \"answer\": true,\n      \"explain\": \"因为一条经过 u 的最长路径由 u 的两个不同孩子的链拼成，所以要用最大和次大（来自不同孩子）。\"\n    },\n    {\n      \"id\": \"h03\",\n      \"type\": \"single\",\n      \"q\": \"求重心时，对每个节点 u，除了比较各个子树的大小，还要比较什么？\",\n      \"options\": [\n        \"「去掉 u 的整棵子树」剩下的那部分，大小是 n - size[u]\",\n        \"u 的度数\",\n        \"u 的深度\",\n        \"叶子的个数\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"删掉 u 之后，除了它的各个子树，还有「上面那一大块」也变成独立连通块，大小正是 n - size[u]。漏掉它是最常见的错误。\"\n    },\n    {\n      \"id\": \"h04\",\n      \"type\": \"multi\",\n      \"q\": \"关于树的直径，下列说法正确的有？\",\n      \"options\": [\n        \"直径可能不止一条\",\n        \"所有直径一定经过树的中点附近的那条边或那个点\",\n        \"两次 DFS 求直径在非负权树上正确\",\n        \"直径一定经过根节点\"\n      ],\n      \"answer\": [0, 1, 2],\n      \"explain\": \"直径和根选在哪无关。根是人为指定的，不影响直径。\"\n    },\n    {\n      \"id\": \"h05\",\n      \"type\": \"single\",\n      \"q\": \"点分治为什么每次要从重心开始分？\",\n      \"options\": [\n        \"这样每次子树规模至少减半，保证总复杂度 O(n log n)\",\n        \"因为重心的深度最大\",\n        \"因为重心的度数最小\",\n        \"因为从重心分代码更好写\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"从重心切开，最大块不超过 n/2，递归层数就是 log n。随便选点分治可能退化成 O(n^2)。\"\n    }\n  ]\n}\n","bank/ds-tree-heap.json":"{\n  \"id\": \"ds-tree-heap\",\n  \"name\": \"堆与优先队列\",\n  \"desc\": \"大根堆 / 小根堆、数组存储、上浮下沉、priority_queue。\",\n  \"visible\": [\n    {\n      \"id\": \"v01\",\n      \"type\": \"judge\",\n      \"q\": \"小根堆中每个节点的值都不大于它的孩子。\",\n      \"answer\": true,\n      \"explain\": \"注意只要求「节点 ≤ 孩子」这个偏序关系，不要求整棵树有序。左右孩子之间的大小没有规定。\"\n    },\n    {\n      \"id\": \"v02\",\n      \"type\": \"single\",\n      \"q\": \"大根堆用数组存储、下标从 1 开始，节点 i（i>1）的父节点下标是？\",\n      \"options\": [\"floor(i / 2)\", \"i - 1\", \"2i\", \"i / 2 取整后再减一\"],\n      \"answer\": 0,\n      \"explain\": \"和完全二叉树编号一样：孩子是 2i、2i+1，父亲是 floor(i/2)。\"\n    },\n    {\n      \"id\": \"v03\",\n      \"type\": \"single\",\n      \"q\": \"往一个 n 个元素的堆里插入一个新元素，时间复杂度是？\",\n      \"options\": [\"O(log n)\", \"O(1)\", \"O(n)\", \"O(n log n)\"],\n      \"answer\": 0,\n      \"explain\": \"把新元素放到数组末尾，然后不停和父亲比较、交换（上浮），最多走树高 log n 层。\"\n    },\n    {\n      \"id\": \"v04\",\n      \"type\": \"single\",\n      \"q\": \"把一个无序数组直接自底向上调整成堆（建堆），时间复杂度是？\",\n      \"options\": [\"O(n)\", \"O(n log n)\", \"O(log n)\", \"O(n^2)\"],\n      \"answer\": 0,\n      \"explain\": \"从最后一个非叶节点往前逐个下沉。越靠底的节点下沉越浅，加权求和收敛到 O(n)，不是 O(n log n)。\"\n    },\n    {\n      \"id\": \"v05\",\n      \"type\": \"single\",\n      \"q\": \"C++ 中 priority_queue<int> pq; 默认是什么堆？\",\n      \"options\": [\"大根堆，pq.top() 是最大值\", \"小根堆\", \"既不是大根堆也不是小根堆\", \"取决于编译器\"],\n      \"answer\": 0,\n      \"explain\": \"默认用 less<int> 比较，堆顶最大。小根堆要写 priority_queue<int, vector<int>, greater<int>>。\"\n    },\n    {\n      \"id\": \"v06\",\n      \"type\": \"single\",\n      \"q\": \"要建一个小根堆的 priority_queue，正确写法是？\",\n      \"options\": [\n        \"priority_queue<int, vector<int>, greater<int>> pq;\",\n        \"priority_queue<int, less<int>> pq;\",\n        \"priority_queue<int, small> pq;\",\n        \"priority_queue<int> pq(small);\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"三个模板参数依次是比较类型、底层容器、比较器。greater<int> 让「更大」的排更后，所以堆顶最小。\"\n    },\n    {\n      \"id\": \"v07\",\n      \"type\": \"multi\",\n      \"q\": \"堆能高效支持的操作有？\",\n      \"options\": [\"取出当前最大/最小值（堆顶）\", \"插入新元素\", \"弹出堆顶\", \"查询第 k 小（单个堆）\"],\n      \"answer\": [0, 1, 2],\n      \"explain\": \"堆只保证堆顶是极值，内部并不有序，所以查询任意第 k 小要另外的手段（对顶堆、可持久化等）。\"\n    },\n    {\n      \"id\": \"v08\",\n      \"type\": \"judge\",\n      \"q\": \"堆一定是一棵完全二叉树。\",\n      \"answer\": true,\n      \"explain\": \"只有这样才可以用连续数组存储、直接用下标算父子关系，这也是堆高效的原因。\"\n    },\n    {\n      \"id\": \"v09\",\n      \"type\": \"single\",\n      \"q\": \"取堆顶元素和弹出堆顶元素的时间复杂度分别是？\",\n      \"options\": [\"O(1) 和 O(log n)\", \"O(log n) 和 O(log n)\", \"O(1) 和 O(1)\", \"O(n) 和 O(n)\"],\n      \"answer\": 0,\n      \"explain\": \"堆顶就在数组第一个位置，直接读是 O(1)。弹出要拿末尾元素补位再下沉，是 O(log n)。\"\n    },\n    {\n      \"id\": \"v10\",\n      \"type\": \"single\",\n      \"q\": \"阅读以下描述，大根堆 {9,7,8,3,5} 插入 10 后，堆顶是？\",\n      \"code\": \"堆（数组）: 9 7 8 3 5\\n插入: 10\",\n      \"options\": [\"10\", \"9\", \"8\", \"5\"],\n      \"answer\": 0,\n      \"explain\": \"10 放到末尾后一直上浮到根：10 比 9 大就交换，最终 10 成为堆顶。\"\n    }\n  ],\n  \"hidden\": [\n    {\n      \"id\": \"h01\",\n      \"type\": \"single\",\n      \"q\": \"为什么自底向上建堆是 O(n)，而「不断插入」建堆是 O(n log n)？\",\n      \"options\": [\n        \"因为大部分节点靠近底层，下沉的距离很短，总的代价求和收敛到 O(n)\",\n        \"因为自底向上不需要比较\",\n        \"因为插入建堆错了\",\n        \"因为数组访问比指针快\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"高度为 h 的节点最多下沉 h 层，而高度 h 的节点数量约 n/2^(h+1)。Σ h · n/2^h 收敛到常数倍 n。\"\n    },\n    {\n      \"id\": \"h02\",\n      \"type\": \"judge\",\n      \"q\": \"堆的中序遍历一定是递增序列。\",\n      \"answer\": false,\n      \"explain\": \"那是 BST 的性质。堆只保证父子之间的偏序，中序结果是乱七八糟的。\"\n    },\n    {\n      \"id\": \"h03\",\n      \"type\": \"single\",\n      \"q\": \"堆的「下沉」（sift down / 向下调整）操作是做什么？\",\n      \"options\": [\n        \"把当前节点和较大的孩子交换，直到满足堆性质\",\n        \"把当前节点和父亲交换\",\n        \"把整个数组排序\",\n        \"把末尾元素移到开头\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"用在删除堆顶、建堆时。和父亲交换的那个叫「上浮」，用在插入时。\"\n    },\n    {\n      \"id\": \"h04\",\n      \"type\": \"multi\",\n      \"q\": \"关于堆，下列说法正确的有？\",\n      \"options\": [\n        \"大根堆的堆顶是整个堆的最大值\",\n        \"堆的左右孩子之间没有大小要求\",\n        \"用堆可以实现优先队列\",\n        \"堆的查找任意元素是 O(1)\"\n      ],\n      \"answer\": [0, 1, 2],\n      \"explain\": \"堆里找任意元素要遍历，是 O(n)。它只对「极值」高效。\"\n    },\n    {\n      \"id\": \"h05\",\n      \"type\": \"single\",\n      \"q\": \"Dijkstra 用优先队列（堆）优化后，复杂度是？\",\n      \"options\": [\"O((V + E) log V)\", \"O(V^2)\", \"O(VE)\", \"O(E)\"],\n      \"answer\": 0,\n      \"explain\": \"每条边最多触发一次堆操作，每次 O(log V)。这个和前面 SPFA 那节的对比是常考点。\"\n    }\n  ]\n}\n","bank/ds-tree-lca.json":"{\n  \"id\": \"ds-tree-lca\",\n  \"name\": \"最近公共祖先 LCA\",\n  \"desc\": \"朴素跳、倍增预处理，以及它在树上倍增问题里的位置。\",\n  \"visible\": [\n    {\n      \"id\": \"v01\",\n      \"type\": \"single\",\n      \"q\": \"两个节点的最近公共祖先（LCA）指的是？\",\n      \"options\": [\n        \"既是它们祖先、又离它们最近的节点（深度最大的公共祖先）\",\n        \"它们父亲节点中较深的那一个\",\n        \"它们路径上深度最小的节点\",\n        \"连接它们的路径的中点\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"是所有公共祖先里深度最大的那个。如果一个节点本身是另一个的祖先，那么 LCA 就是它自己。\"\n    },\n    {\n      \"id\": \"v02\",\n      \"type\": \"single\",\n      \"q\": \"朴素的 LCA 做法（先跳到同深度，再一起往上跳）单次查询的复杂度是？\",\n      \"options\": [\"O(树高)，最坏 O(n)\", \"O(1)\", \"O(log n)\", \"O(n log n)\"],\n      \"answer\": 0,\n      \"explain\": \"每次只能往上走一格。链状树上树高是 n，查询就退化成 O(n)。\"\n    },\n    {\n      \"id\": \"v03\",\n      \"type\": \"single\",\n      \"q\": \"倍增法求 LCA 的预处理复杂度和单次查询复杂度分别是？\",\n      \"options\": [\"O(n log n) 和 O(log n)\", \"O(n) 和 O(1)\", \"O(n log n) 和 O(1)\", \"O(n^2) 和 O(log n)\"],\n      \"answer\": 0,\n      \"explain\": \"预处理每点的 2^i 级祖先共 n log n 项；查询时利用二进制拆分一次跳一大截，只需 log n 次。\"\n    },\n    {\n      \"id\": \"v04\",\n      \"type\": \"judge\",\n      \"q\": \"倍增法中 f[u][i] 表示节点 u 往上走 2^i 步到达的祖先。\",\n      \"answer\": true,\n      \"explain\": \"所以 f[u][0] 就是父亲，f[u][i] = f[f[u][i-1]][i-1]，这个递推式子是整个倍增法的核心。\"\n    },\n    {\n      \"id\": \"v05\",\n      \"type\": \"single\",\n      \"q\": \"倍增数组 f[u][i] 中，f[u][0] 表示的是？\",\n      \"options\": [\"u 的父亲节点\", \"u 自己\", \"u 的根节点\", \"u 的深度\"],\n      \"answer\": 0,\n      \"explain\": \"往上走 2^0 = 1 步就是父亲。根节点的 f 通常记为 0（表示不存在）。\"\n    },\n    {\n      \"id\": \"v06\",\n      \"type\": \"multi\",\n      \"q\": \"LCA 可以用在哪些地方？\",\n      \"options\": [\n        \"求树上两点间距离（dis[u]+dis[v]-2*dis[lca]）\",\n        \"树上路径修改 / 查询（配合差分）\",\n        \"判断一个点是否在另一对点的路径上\",\n        \"求单源最短路（正权图）\"\n      ],\n      \"answer\": [0, 1, 2],\n      \"explain\": \"最短路是 Dijkstra / SPFA 的活。前三个都是 LCA 的经典应用，尤其那个距离公式要背下来。\"\n    },\n    {\n      \"id\": \"v07\",\n      \"type\": \"single\",\n      \"q\": \"倍增法求 LCA 之前，必须先预处理出什么？\",\n      \"options\": [\"每个节点的深度和倍增祖先表\", \"每个节点的子树大小\", \"每个节点的入度\", \"整棵树的直径\"],\n      \"answer\": 0,\n      \"explain\": \"深度用来先对齐两层节点；倍增表用来一次跳一大截。两者缺一不可。\"\n    },\n    {\n      \"id\": \"v08\",\n      \"type\": \"judge\",\n      \"q\": \"求 LCA 时，如果两个节点深度不同，应该先把较深的那个往上跳到与另一个同深度。\",\n      \"answer\": true,\n      \"explain\": \"对齐深度之后，两边才能同步往上跳。否则会各跳各的，永远对不上。\"\n    },\n    {\n      \"id\": \"v09\",\n      \"type\": \"single\",\n      \"q\": \"倍增数组的第二维大小应该开多少？（n 个节点）\",\n      \"options\": [\"floor(log2 n) + 1\", \"n\", \"2\", \"sqrt(n)\"],\n      \"answer\": 0,\n      \"explain\": \"2^i 要不小于最大深度，所以 i 最大取到 log2 n。多开一两层更保险。\"\n    },\n    {\n      \"id\": \"v10\",\n      \"type\": \"single\",\n      \"q\": \"阅读以下描述，节点 4 和节点 5 的 LCA 是？\",\n      \"code\": \"        1\\n       / \\\\\\n      2   3\\n     / \\\\\\n    4   5\",\n      \"options\": [\"2\", \"1\", \"4\", \"3\"],\n      \"answer\": 0,\n      \"explain\": \"4 的祖先链是 4→2→1，5 的是 5→2→1。公共祖先里深度最大的是 2。\"\n    }\n  ],\n  \"hidden\": [\n    {\n      \"id\": \"h01\",\n      \"type\": \"single\",\n      \"q\": \"倍增法跳跃时，为什么最后是「跳到 LCA 的孩子」，而不是直接跳到 LCA？\",\n      \"options\": [\n        \"因为直接跳无法判断跳过头没有；先跳到 LCA 的正下方，答案就是它的父亲\",\n        \"因为跳到 LCA 会数组越界\",\n        \"因为 LCA 的深度可能是 0\",\n        \"两者等价，写法不同而已\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"枚举时只跳「跳过去之后两点仍不相同」的位置，跳完就停在 LCA 正下方，它们的父亲即 LCA。\"\n    },\n    {\n      \"id\": \"h02\",\n      \"type\": \"judge\",\n      \"q\": \"树链剖分也可以用来求 LCA。\",\n      \"answer\": true,\n      \"explain\": \"沿重链往上跳，每次把链头较深的那个跳上去，直到同一条链，此时浅的那个就是 LCA。单次也是 O(log n)。\"\n    },\n    {\n      \"id\": \"h03\",\n      \"type\": \"single\",\n      \"q\": \"离线求 LCA 的 Tarjan 算法（基于 DFS + 并查集）单次均摊复杂度是？\",\n      \"options\": [\"接近 O(1)（并查集路径压缩的均摊意义下）\", \"O(log n)\", \"O(n)\", \"O(n log n)\"],\n      \"answer\": 0,\n      \"explain\": \"DFS 过程中把已回溯完的子树合并到父亲，遇到查询就检查对方是否已访问。总复杂度 O(n + q)。\"\n    },\n    {\n      \"id\": \"h04\",\n      \"type\": \"multi\",\n      \"q\": \"关于倍增法，下列说法正确的有？\",\n      \"options\": [\n        \"f[u][i] = f[f[u][i-1]][i-1]\",\n        \"预处理数组大小是 n × log n\",\n        \"根节点的父亲记为 0，表示不存在\",\n        \"倍增只能求 LCA，不能做别的\"\n      ],\n      \"answer\": [0, 1, 2],\n      \"explain\": \"倍增是个通用技巧，还能求第 k 级祖先、支持路径上的最大值/最小值（配合额外数组），甚至优化 DP 转移。\"\n    },\n    {\n      \"id\": \"h05\",\n      \"type\": \"single\",\n      \"q\": \"已知 dis[x] 表示根到 x 的路径长度（边权和），树上 x、y 两点距离是？\",\n      \"options\": [\n        \"dis[x] + dis[y] - 2 * dis[lca(x,y)]\",\n        \"dis[x] + dis[y]\",\n        \"abs(dis[x] - dis[y])\",\n        \"dis[lca(x,y)]\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"根到两点的路径在 LCA 之上重叠了两次，减去两倍那一段就是真实距离。这是树上问题的基本公式。\"\n    }\n  ]\n}\n","bank/ds-tree-restore.json":"{\n  \"id\": \"ds-tree-restore\",\n  \"name\": \"由遍历序列还原树\",\n  \"desc\": \"先序+中序、中序+后序怎么递归还原；为什么少了中序就不行。\",\n  \"visible\": [\n    {\n      \"id\": \"v01\",\n      \"type\": \"single\",\n      \"q\": \"用先序 + 中序还原二叉树时，先序序列的第一个元素是什么？\",\n      \"options\": [\"整棵树的根\", \"最左边的节点\", \"任意一个叶子\", \"没有意义\"],\n      \"answer\": 0,\n      \"explain\": \"先序是「根、左、右」，所以第一个一定是根。拿这个根去中序里一切，就能分出左右子树。\"\n    },\n    {\n      \"id\": \"v02\",\n      \"type\": \"judge\",\n      \"q\": \"中序序列的作用是「划分左右子树」，另一组序列的作用是「确定根」。\",\n      \"answer\": true,\n      \"explain\": \"这是还原问题的通用套路：中序告诉你左右各有几个点，先序/后序/层序告诉你谁是根。\"\n    },\n    {\n      \"id\": \"v03\",\n      \"type\": \"single\",\n      \"q\": \"只有先序序列和后序序列，为什么无法唯一确定二叉树？\",\n      \"options\": [\n        \"无法区分某个子树是左孩子还是右孩子\",\n        \"序列长度可能不一样\",\n        \"后序序列里没有根的信息\",\n        \"其实可以唯一确定\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"先序第二个、后序倒数第二个元素就是子树的根，但它到底挂在左边还是右边，两组序列给不出答案。\"\n    },\n    {\n      \"id\": \"v04\",\n      \"type\": \"single\",\n      \"q\": \"已知先序 ABDECFG、中序 DBEAFCG，根节点 A 的左子树有几个节点？\",\n      \"options\": [\"3\", \"2\", \"4\", \"5\"],\n      \"answer\": 0,\n      \"explain\": \"中序是 D B E | A | F C G，A 前面有 D、B、E 共 3 个，正好是左子树。\"\n    },\n    {\n      \"id\": \"v05\",\n      \"type\": \"single\",\n      \"q\": \"已知先序 ABDECFG、中序 DBEAFCG，这棵树的后序序列是？\",\n      \"options\": [\"DEBFGCA\", \"DEBCFGA\", \"BDEAFGC\", \"EDBFGCA\"],\n      \"answer\": 0,\n      \"explain\": \"左子树先序 BDE、后序 DEB；右子树先序 CFG、后序 FGC；根 A 放最后 → DEB + FGC + A。\"\n    },\n    {\n      \"id\": \"v06\",\n      \"type\": \"single\",\n      \"q\": \"用中序 + 后序还原时，应该先从后序的哪个位置取根？\",\n      \"options\": [\"最后一个元素\", \"第一个元素\", \"中间元素\", \"随便哪个都行\"],\n      \"answer\": 0,\n      \"explain\": \"后序是「左、右、根」，根永远在末尾。取到最后那个，再去中序里划分。\"\n    },\n    {\n      \"id\": \"v07\",\n      \"type\": \"judge\",\n      \"q\": \"已知中序序列和层序序列，也可以唯一确定一棵二叉树。\",\n      \"answer\": true,\n      \"explain\": \"层序的第一个就是根，同样拿它切中序。只要含中序，再加任意一种「能定根」的序列就够了。\"\n    },\n    {\n      \"id\": \"v08\",\n      \"type\": \"multi\",\n      \"q\": \"下列关于还原二叉树的说法，正确的有？\",\n      \"options\": [\n        \"先序 + 中序可以唯一确定\",\n        \"中序 + 后序可以唯一确定\",\n        \"先序 + 后序不能唯一确定\",\n        \"只给一个先序序列可以唯一确定\"\n      ],\n      \"answer\": [0, 1, 2],\n      \"explain\": \"只给先序什么都定不了，形状完全自由的树都可能给出同一个先序。\"\n    },\n    {\n      \"id\": \"v09\",\n      \"type\": \"single\",\n      \"q\": \"还原算法里「在中序序列中查找根的位置」，如果每次线性查找，最坏复杂度是？\",\n      \"options\": [\"O(n^2)\", \"O(n)\", \"O(n log n)\", \"O(log n)\"],\n      \"answer\": 0,\n      \"explain\": \"每次划分都要扫一遍当前区间，最坏（如链状树）是 O(n^2)。用哈希表预存值到下标的映射，就能降到 O(n)。\"\n    },\n    {\n      \"id\": \"v10\",\n      \"type\": \"single\",\n      \"q\": \"已知先序 ABDECFG、中序 DBEAFCG，这棵树的左子树的根是？\",\n      \"options\": [\"B\", \"D\", \"E\", \"C\"],\n      \"answer\": 0,\n      \"explain\": \"左子树的中序是 D B E、先序是 B D E，先序的第一个 B 就是左子树的根，D、E 分别是它的左右孩子。\"\n    }\n  ],\n  \"hidden\": [\n    {\n      \"id\": \"h01\",\n      \"type\": \"single\",\n      \"q\": \"两个节点的树，先序都是 AB、后序都是 BA，为什么有两棵不同的树都成立？\",\n      \"options\": [\n        \"B 可以是 A 的左孩子，也可以是 A 的右孩子\",\n        \"其中一棵是非法的\",\n        \"后序算错了\",\n        \"A 不是根\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"正是这一点让「先序+后序」失效 —— 只有两个节点时两种形状给出完全相同的两组序列。\"\n    },\n    {\n      \"id\": \"h02\",\n      \"type\": \"judge\",\n      \"q\": \"还原时，如果中序区间为空，说明对应子树不存在，应该直接返回。\",\n      \"answer\": true,\n      \"explain\": \"这是递归的边界条件。和普通递归一样，空区间就是「这棵子树是空的」。\"\n    },\n    {\n      \"id\": \"h03\",\n      \"type\": \"single\",\n      \"q\": \"已知中序序列是 1 2 3 4 5，且知道这是一棵 BST，那么这棵树？\",\n      \"options\": [\n        \"形状不唯一，可能是右斜链也可能是别的形状\",\n        \"一定是右斜链\",\n        \"一定是完全二叉树\",\n        \"形状唯一确定\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"只有中序（哪怕配上「是 BST」这个条件）也定不下形状。BST 的要求只是中序递增，形状可以很自由。\"\n    },\n    {\n      \"id\": \"h04\",\n      \"type\": \"multi\",\n      \"q\": \"关于「用先序 + 中序还原」，下列说法正确的有？\",\n      \"options\": [\n        \"递归时左子树的中序区间长等于左子树的先序区间长\",\n        \"根的左子树节点数等于中序中根左边元素个数\",\n        \"还原一定得到唯一一棵树\",\n        \"必须先建右子树再建左子树\"\n      ],\n      \"answer\": [0, 1, 2],\n      \"explain\": \"左右子树谁先建都行，不影响结果。区间长度的对应关系是能正确切分的关键。\"\n    },\n    {\n      \"id\": \"h05\",\n      \"type\": \"single\",\n      \"q\": \"如果先序序列长度为 n 且无重复元素，理论上能给出多少棵不同的二叉树？\",\n      \"options\": [\n        \"很多棵（第 n 个卡特兰数级别的数量）\",\n        \"恰好 1 棵\",\n        \"恰好 n 棵\",\n        \"恰好 2 棵\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"n 个节点的二叉树形态数是卡特兰数，增长极快。这正是必须补上中序才能唯一确定的原因。\"\n    }\n  ]\n}\n","bank/ds-tree-traverse.json":"{\n  \"id\": \"ds-tree-traverse\",\n  \"name\": \"二叉树的遍历\",\n  \"desc\": \"先序、中序、后序、层序，以及遍历序列的用途。\",\n  \"visible\": [\n    {\n      \"id\": \"v01\",\n      \"type\": \"single\",\n      \"q\": \"先序遍历的访问顺序是？\",\n      \"options\": [\"根 → 左 → 右\", \"左 → 根 → 右\", \"左 → 右 → 根\", \"根 → 右 → 左\"],\n      \"answer\": 0,\n      \"explain\": \"先序（前序）：先访问根，再递归左子树，最后递归右子树。\"\n    },\n    {\n      \"id\": \"v02\",\n      \"type\": \"single\",\n      \"q\": \"中序遍历的访问顺序是？\",\n      \"options\": [\"左 → 根 → 右\", \"根 → 左 → 右\", \"左 → 右 → 根\", \"根 → 右 → 左\"],\n      \"answer\": 0,\n      \"explain\": \"中序把根放在左右子树中间。它最大的用处是：对 BST 做中序会得到递增序列。\"\n    },\n    {\n      \"id\": \"v03\",\n      \"type\": \"single\",\n      \"q\": \"后序遍历的访问顺序是？\",\n      \"options\": [\"左 → 右 → 根\", \"根 → 左 → 右\", \"左 → 根 → 右\", \"右 → 左 → 根\"],\n      \"answer\": 0,\n      \"explain\": \"后序最后才访问根，所以很适合「先算完子树再汇总」的场景，比如求子树大小、树形 DP。\"\n    },\n    {\n      \"id\": \"v04\",\n      \"type\": \"judge\",\n      \"q\": \"只知道先序序列和后序序列，就能唯一确定一棵二叉树。\",\n      \"answer\": false,\n      \"explain\": \"不能。比如只有两个节点时，A 是 B 的父亲还是一左一右，两种树的先序都是 AB、后序都是 BA。必须有中序才能定下来。\"\n    },\n    {\n      \"id\": \"v05\",\n      \"type\": \"single\",\n      \"q\": \"对一棵二叉搜索树做中序遍历，得到的序列是？\",\n      \"options\": [\"递增有序序列\", \"递减有序序列\", \"先序序列\", \"随机顺序\"],\n      \"answer\": 0,\n      \"explain\": \"左 < 根 < 右，中序正好从小到大依次访问。这也是判断一棵树是不是 BST 的常用办法。\"\n    },\n    {\n      \"id\": \"v06\",\n      \"type\": \"single\",\n      \"q\": \"阅读以下描述，这棵树的先序遍历序列是？\",\n      \"code\": \"    A\\n   / \\\\\\n  B   C\\n / \\\\\\nD   E\",\n      \"options\": [\"ABDEC\", \"ABDCE\", \"DBAEC\", \"ABCDE\"],\n      \"answer\": 0,\n      \"explain\": \"先访问 A，再左子树 B（B 之后先 D 再 E），最后右子树 C → A B D E C。\"\n    },\n    {\n      \"id\": \"v07\",\n      \"type\": \"multi\",\n      \"q\": \"下列哪几组序列可以唯一确定一棵二叉树？\",\n      \"options\": [\"先序 + 中序\", \"中序 + 后序\", \"先序 + 后序\", \"中序 + 层序\"],\n      \"answer\": [0, 1, 3],\n      \"explain\": \"共同点是都含有中序。中序负责划分左右子树，另一组负责确定根，缺了中序就无法定下来。\"\n    },\n    {\n      \"id\": \"v08\",\n      \"type\": \"single\",\n      \"q\": \"层序遍历通常借助什么来实现？\",\n      \"options\": [\"队列\", \"栈\", \"优先队列\", \"哈希表\"],\n      \"answer\": 0,\n      \"explain\": \"根入队，出队时把左右孩子依次入队，就自然按层访问了。用栈会变成别的顺序。\"\n    },\n    {\n      \"id\": \"v09\",\n      \"type\": \"judge\",\n      \"q\": \"已知中序序列和后序序列，可以唯一确定一棵二叉树。\",\n      \"answer\": true,\n      \"explain\": \"后序的最后一个元素是根，拿它去中序里切出左右子树，再递归。每组都唯一，所以整棵树唯一。\"\n    },\n    {\n      \"id\": \"v10\",\n      \"type\": \"single\",\n      \"q\": \"阅读以下描述，这棵树的中序遍历序列是？\",\n      \"code\": \"    A\\n   / \\\\\\n  B   C\\n / \\\\\\nD   E\",\n      \"options\": [\"DBEAC\", \"ABDEC\", \"DEBAC\", \"DBAEC\"],\n      \"answer\": 0,\n      \"explain\": \"左子树 B 的中序是 D B E，然后根 A，再右子树 C → D B E A C。\"\n    }\n  ],\n  \"hidden\": [\n    {\n      \"id\": \"h01\",\n      \"type\": \"single\",\n      \"q\": \"已知先序 ABDECFG、中序 DBEAFCG，后序序列是？\",\n      \"options\": [\"DEBFGCA\", \"DEBCFGA\", \"BDEAFGC\", \"EDBFGCA\"],\n      \"answer\": 0,\n      \"explain\": \"由先序定根 A，中序切成左 DBE / 右 FCG。左子树先序 BDE、后序 DEB；右子树先序 CFG、后序 FGC。合起来 DEB + FGC + A。\"\n    },\n    {\n      \"id\": \"h02\",\n      \"type\": \"judge\",\n      \"q\": \"由中序和后序还原二叉树时，后序序列的最后一个元素是整棵树的根。\",\n      \"answer\": true,\n      \"explain\": \"后序是「左、右、根」，根永远在最后。先序则是第一个元素为根。\"\n    },\n    {\n      \"id\": \"h03\",\n      \"type\": \"single\",\n      \"q\": \"一棵二叉树的先序和中序都是 ABC，这棵树是？\",\n      \"options\": [\n        \"A 为根、B 为 A 的右孩子、C 为 B 的右孩子\",\n        \"A 为根、B 为 A 的左孩子、C 为 B 的左孩子\",\n        \"完全二叉树\",\n        \"无法确定\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"中序 ABC 中 A 在最左，说明 A 没有左子树；B 在 A 之后，是 A 的右孩子；C 同理接在 B 右边。\"\n    },\n    {\n      \"id\": \"h04\",\n      \"type\": \"multi\",\n      \"q\": \"关于二叉树遍历，下列说法正确的有？\",\n      \"options\": [\n        \"先序序列的第一个元素一定是根\",\n        \"后序序列的最后一个元素一定是根\",\n        \"层序遍历用队列实现\",\n        \"中序序列的最后一个元素一定是根\"\n      ],\n      \"answer\": [0, 1, 2],\n      \"explain\": \"中序是「左、根、右」，根的右边还有右子树，所以根不会固定在首尾。\"\n    },\n    {\n      \"id\": \"h05\",\n      \"type\": \"single\",\n      \"q\": \"求每个节点的子树大小时，最自然的是哪种遍历顺序？\",\n      \"options\": [\"后序\", \"先序\", \"层序\", \"中序都行\"],\n      \"answer\": 0,\n      \"explain\": \"后序先处理完左右子树再轮到根，所以轮到根时子树大小已经算好，直接相加即可。\"\n    }\n  ]\n}\n","bank/dsu.json":"{\n  \"id\": \"dsu\",\n  \"name\": \"并查集\",\n  \"desc\": \"路径压缩、按秩合并、连通性判定、Kruskal 的基础。\",\n  \"visible\": [\n    {\n      \"id\": \"v01\",\n      \"type\": \"single\",\n      \"q\": \"并查集主要支持什么操作？\",\n      \"options\": [\n        \"合并集合与查询代表元\",\n        \"最短路\",\n        \"排序\",\n        \"哈希\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"并查集维护不相交集合。\"\n    },\n    {\n      \"id\": \"v02\",\n      \"type\": \"judge\",\n      \"q\": \"路径压缩可以降低并查集查询的时间复杂度。\",\n      \"answer\": true,\n      \"explain\": \"查询时把路径上的点直接连到根。\"\n    },\n    {\n      \"id\": \"v03\",\n      \"type\": \"single\",\n      \"q\": \"并查集中判断两个元素是否在同一集合，通常比较？\",\n      \"options\": [\n        \"根节点是否相同\",\n        \"值是否相等\",\n        \"深度是否相同\",\n        \"度数是否相同\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"find(x) == find(y)。\"\n    },\n    {\n      \"id\": \"v04\",\n      \"type\": \"judge\",\n      \"q\": \"按秩合并可以避免并查集退化成链。\",\n      \"answer\": true,\n      \"explain\": \"把矮树接到高树上。\"\n    },\n    {\n      \"id\": \"v05\",\n      \"type\": \"single\",\n      \"q\": \"Kruskal 算法中，并查集用于？\",\n      \"options\": [\n        \"判断加入边是否成环\",\n        \"排序边\",\n        \"求最短路\",\n        \"求拓扑序\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"若两端点已连通，则加入会成环。\"\n    },\n    {\n      \"id\": \"v06\",\n      \"type\": \"judge\",\n      \"q\": \"并查集可以支持删除操作。\",\n      \"answer\": false,\n      \"explain\": \"普通并查集不支持删除，需要特殊技巧。\"\n    },\n    {\n      \"id\": \"v07\",\n      \"type\": \"single\",\n      \"q\": \"find 操作的作用是？\",\n      \"options\": [\n        \"找到元素所在集合的根\",\n        \"删除元素\",\n        \"插入元素\",\n        \"排序\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"返回代表元。\"\n    },\n    {\n      \"id\": \"v08\",\n      \"type\": \"judge\",\n      \"q\": \"并查集可以判断无向图连通分量个数。\",\n      \"answer\": true,\n      \"explain\": \"合并后统计不同根的数量。\"\n    },\n    {\n      \"id\": \"v09\",\n      \"type\": \"single\",\n      \"q\": \"路径压缩后，并查集单次操作均摊复杂度接近？\",\n      \"options\": [\n        \"O(α(n))\",\n        \"O(n)\",\n        \"O(log n)\",\n        \"O(n^2)\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"α 是反阿克曼函数，增长极慢。\"\n    },\n    {\n      \"id\": \"v10\",\n      \"type\": \"judge\",\n      \"q\": \"并查集可以用于维护朋友关系。\",\n      \"answer\": true,\n      \"explain\": \"朋友关系具有连通性，可用并查集合并。\"\n    }\n  ],\n  \"hidden\": [\n    {\n      \"id\": \"h01\",\n      \"type\": \"single\",\n      \"q\": \"并查集初始化时，每个元素的父节点通常是？\",\n      \"options\": [\n        \"自己\",\n        \"0\",\n        \"-1\",\n        \"根节点\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"每个元素自成一个集合。\"\n    },\n    {\n      \"id\": \"h02\",\n      \"type\": \"judge\",\n      \"q\": \"按大小合并和按秩合并都能优化并查集。\",\n      \"answer\": true,\n      \"explain\": \"都是启发式合并。\"\n    },\n    {\n      \"id\": \"h03\",\n      \"type\": \"single\",\n      \"q\": \"Kruskal 求最小生成树时，边按什么顺序处理？\",\n      \"options\": [\n        \"边权从小到大\",\n        \"边权从大到小\",\n        \"随机\",\n        \"按端点编号\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"贪心选择最小边。\"\n    },\n    {\n      \"id\": \"h04\",\n      \"type\": \"single\",\n      \"q\": \"并查集能高效维护什么关系？\",\n      \"options\": [\n        \"等价关系\",\n        \"偏序关系\",\n        \"函数关系\",\n        \"随机关系\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"自反、对称、传递的关系。\"\n    },\n    {\n      \"id\": \"h05\",\n      \"type\": \"judge\",\n      \"q\": \"带权并查集可以维护元素到根的距离。\",\n      \"answer\": true,\n      \"explain\": \"常用于关系判定和差分约束。\"\n    }\n  ]\n}\n","bank/graph-spfa.json":"{\n  \"id\": \"graph-spfa\",\n  \"name\": \"最短路 SPFA\",\n  \"desc\": \"Bellman-Ford 的队列优化，能带负权、能判负环，也会被卡。CSP-J 到 NOIP 都常考。\",\n  \"visible\": [\n    {\n      \"id\": \"v01\",\n      \"type\": \"judge\",\n      \"q\": \"SPFA 是 Bellman-Ford 算法的队列优化版本。\",\n      \"answer\": true,\n      \"explain\": \"全称 Shortest Path Faster Algorithm，思路还是「反复松弛」，只是只把被松弛过的点入队继续扩。\"\n    },\n    {\n      \"id\": \"v02\",\n      \"type\": \"single\",\n      \"q\": \"SPFA 的最坏时间复杂度是？（V 是点数，E 是边数）\",\n      \"options\": [\"O(E)\", \"O(V + E)\", \"O(VE)\", \"O(E log V)\"],\n      \"answer\": 2,\n      \"explain\": \"最坏 O(VE)，和朴素 Bellman-Ford 同级。随机图上通常远快于这个，但特殊构造的图能把它的常数和次数都拉满。\"\n    },\n    {\n      \"id\": \"v03\",\n      \"type\": \"single\",\n      \"q\": \"关于 SPFA 能不能处理负权边，正确的是？\",\n      \"options\": [\"完全不能处理负权边\", \"可以，只要图中没有负环\", \"只能处理负权，不能处理正权\", \"只有无向图可以\"],\n      \"answer\": 1,\n      \"explain\": \"有负权边没问题，用 SPFA 或 Bellman-Ford；但一旦存在负环，最短路无意义，只能判出来。\"\n    },\n    {\n      \"id\": \"v04\",\n      \"type\": \"single\",\n      \"q\": \"用 SPFA 判断负环，常用的依据是？\",\n      \"options\": [\"某个点被松弛的次数超过 n 次\", \"某个点入队次数达到 n 次\", \"队列长度超过 n\", \"dis 数组出现负数\"],\n      \"answer\": 1,\n      \"explain\": \"正常图上每个点最多被更新 n-1 次（所以入队也有限）；某个点入队达到 n 次，说明被反复松弛，存在负环。\"\n    },\n    {\n      \"id\": \"v05\",\n      \"type\": \"single\",\n      \"q\": \"阅读以下程序，输出的结果是？\",\n      \"code\": \"// 邻接表 + SPFA，求 1 号点到 3 号点的最短路\\n// 边：1->2 权 2，2->3 权 3，1->3 权 9\\ncout << dis[3];\",\n      \"options\": [\"9\", \"5\", \"6\", \"14\"],\n      \"answer\": 1,\n      \"explain\": \"1->2->3 总权 2+3=5，比直接 1->3 的 9 更短。\"\n    },\n    {\n      \"id\": \"v06\",\n      \"type\": \"multi\",\n      \"q\": \"关于 SPFA，下列说法正确的有？\",\n      \"options\": [\"它用队列维护「需要继续松弛的点」\", \"一个点出队后，之后可能还会再次入队\", \"存在负环时，SPFA 会无限入队\", \"SPFA 只能用于有向图\"],\n      \"answer\": [0, 1, 2],\n      \"explain\": \"无向图把每条边拆成两条有向边照样跑。前三条都对。\"\n    },\n    {\n      \"id\": \"v07\",\n      \"type\": \"judge\",\n      \"q\": \"在边权全为非负的图上，SPFA 一定比堆优化 Dijkstra 快。\",\n      \"answer\": false,\n      \"explain\": \"反了。非负权图里堆优化 Dijkstra 复杂度稳定 O((V+E) log V)，而 SPFA 最坏 O(VE)，出题人专门构造就能卡死。\"\n    },\n    {\n      \"id\": \"v08\",\n      \"type\": \"single\",\n      \"q\": \"SPFA 开始时把 dis 数组全部置为「无穷大」、dis[s] 置 0，这样做的目的是？\",\n      \"options\": [\n        \"防止 dis 的值为负\",\n        \"区分「还没算出来」和「已经算出来」，并让第一次松弛一定能发生\",\n        \"为了让数组看起来整齐\",\n        \"避免使用 long long\"\n      ],\n      \"answer\": 1,\n      \"explain\": \"无穷大表示暂不可达，源点自己到自己是 0。第一次遇到边时 dis[u]+w 一定小于无穷大，松弛才能触发。\"\n    },\n    {\n      \"id\": \"v09\",\n      \"type\": \"single\",\n      \"q\": \"用链式前向星存图时，`next` 数组的作用是？\",\n      \"options\": [\n        \"指向同一个起点出发的下一条边\",\n        \"指向这条边的终点\",\n        \"指向这条边的权值\",\n        \"记录这条边有没有走过\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"head[u] 是 u 的第一条边，next[i] 串起所有从 u 出发的边，遍历时沿着 next 一路走。\"\n    },\n    {\n      \"id\": \"v10\",\n      \"type\": \"single\",\n      \"q\": \"阅读以下程序，输出的结果是？\",\n      \"code\": \"// 边：1->2 权 1，2->3 权 1，1->3 权 5\\n// 求 1 到 3 的最短路\\ncout << dis[3];\",\n      \"options\": [\"5\", \"2\", \"6\", \"1\"],\n      \"answer\": 1,\n      \"explain\": \"1->2->3 是 1+1=2，比 1->3 的 5 短。\"\n    }\n  ],\n  \"hidden\": [\n    {\n      \"id\": \"h01\",\n      \"type\": \"single\",\n      \"q\": \"为什么 SPFA 容易被「网格图 + 特殊边权」卡成最坏复杂度？\",\n      \"options\": [\n        \"因为网格图的边太多了，超过内存\",\n        \"因为同一个点会被反复入队，松弛次数被拉到接近 O(VE)\",\n        \"因为网格图一定有负环\",\n        \"因为队列的容量不够\"\n      ],\n      \"answer\": 1,\n      \"explain\": \"出题人可以构造让点不断被更新、不断重新入队的图，松弛总次数逼近 O(VE)。所以正式比赛非负权优先写 Dijkstra。\"\n    },\n    {\n      \"id\": \"h02\",\n      \"type\": \"judge\",\n      \"q\": \"把所有源点的 dis 都置 0 并一起入队，SPFA 可以求多源最短路。\",\n      \"answer\": true,\n      \"explain\": \"相当于新建一个虚源点连向所有源点、边权 0，不改变任何点到源集合的最短距离。\"\n    },\n    {\n      \"id\": \"h03\",\n      \"type\": \"single\",\n      \"q\": \"一个带负环的图上跑 SPFA（不做入队次数判断），会发生什么？\",\n      \"options\": [\n        \"输出一个很大的负数作为答案\",\n        \"程序可能在两点间无限松弛、队列永不为空\",\n        \"自动跳过负环，输出次短路\",\n        \"编译错误\"\n      ],\n      \"answer\": 1,\n      \"explain\": \"沿负环绕一圈距离就变小一次，可以无限变小，所以会一直松弛下去 —— 这就是要加上「入队次数 ≥ n」判断的原因。\"\n    },\n    {\n      \"id\": \"h04\",\n      \"type\": \"multi\",\n      \"q\": \"SPFA 相比朴素 Bellman-Ford 做的改进有？\",\n      \"options\": [\n        \"只把「被成功松弛的点」放进队列，而不是每轮扫全部边\",\n        \"每轮不必再遍历所有边\",\n        \"在非负权图上一定能得到正确答案（两者都可以）\",\n        \"把最坏复杂度降到了 O(E)\"\n      ],\n      \"answer\": [0, 1, 2],\n      \"explain\": \"SPFA 是常数和实际效率上的优化，最坏复杂度仍是 O(VE)，没有降到 O(E)。\"\n    },\n    {\n      \"id\": \"h05\",\n      \"type\": \"single\",\n      \"q\": \"SLF 优化指的是？\",\n      \"options\": [\n        \"入队时，若新点的 dis 比队首小，就插到队首，否则插到队尾\",\n        \"每次从队列尾部取点\",\n        \"用优先队列代替普通队列\",\n        \"把 dis 数组换成哈希表\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"Small Label First。让更优的点先被扩展，实践里能提速，但依旧挡不住针对性的卡。\"\n    }\n  ]\n}\n","bank/graph-tarjan.json":"{\n  \"id\": \"graph-tarjan\",\n  \"name\": \"Tarjan 与连通性\",\n  \"desc\": \"强连通分量、割点、桥、双连通。dfs 序 + low 数组，一套框架打好几个问题。NOIP 提高组的常客。\",\n  \"visible\": [\n    {\n      \"id\": \"v01\",\n      \"type\": \"judge\",\n      \"q\": \"Tarjan 求强连通分量是在一次 DFS 中完成的，靠 dfn 和 low 两个数组记录信息。\",\n      \"answer\": true,\n      \"explain\": \"dfn 是第一次访问的时间戳，low 是能回溯到的最早时间戳。整个算法一趟 DFS 走完。\"\n    },\n    {\n      \"id\": \"v02\",\n      \"type\": \"single\",\n      \"q\": \"在有向图 Tarjan 中，low[u] 的含义是？\",\n      \"options\": [\n        \"u 直接连出去的所有点里 dfn 最小的那个\",\n        \"u 及其 DFS 子树能回溯到的最早的、仍在栈中的点的 dfn\",\n        \"u 的父亲节点的 dfn\",\n        \"u 所在强连通分量中编号最小的点的 dfn\"\n      ],\n      \"answer\": 1,\n      \"explain\": \"「仍在栈中」这个限定很关键：已经确定了 SCC 的点不该再参与更新。\"\n    },\n    {\n      \"id\": \"v03\",\n      \"type\": \"single\",\n      \"q\": \"强连通分量（SCC）的定义是？\",\n      \"options\": [\n        \"任意两点都能互相到达的极大子图\",\n        \"所有点都两两有边相连的图\",\n        \"不包含环的极大子图\",\n        \"边数最少的连通子图\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"注意「极大」：再加一个点进去就破坏强连通性。单个孤立点自己也是一个 SCC。\"\n    },\n    {\n      \"id\": \"v04\",\n      \"type\": \"single\",\n      \"q\": \"无向图求割点时，对非根节点 u 和它的子节点 v，判定条件是？\",\n      \"options\": [\"low[v] >= dfn[u]\", \"low[v] > dfn[u]\", \"low[v] == dfn[u]\", \"dfn[v] > dfn[u]\"],\n      \"answer\": 0,\n      \"explain\": \"v 向上回不到 u 的祖先（只能到自己或 u），删掉 u 后 v 那一支就和祖先断了。取等号说明恰好只能回到 u。\"\n    },\n    {\n      \"id\": \"v05\",\n      \"type\": \"single\",\n      \"q\": \"无向图求桥（割边）的判定条件是？\",\n      \"options\": [\"low[v] >= dfn[u]\", \"low[v] > dfn[u]\", \"low[v] < dfn[u]\", \"dfn[v] == dfn[u]\"],\n      \"answer\": 1,\n      \"explain\": \"比割点多一个严格大于：v 连 u 都回不到，说明 (u,v) 这条边是唯一的通路。所以割边一定在两个点双之间。\"\n    },\n    {\n      \"id\": \"v06\",\n      \"type\": \"multi\",\n      \"q\": \"用 Tarjan 的这套框架可以求出的东西有？\",\n      \"options\": [\"强连通分量\", \"无向图的割点\", \"无向图的桥\", \"单源最短路径\"],\n      \"answer\": [0, 1, 2],\n      \"explain\": \"最短路是另一套东西（Dijkstra / SPFA / Bellman-Ford），和 Tarjan 没关系。\"\n    },\n    {\n      \"id\": \"v07\",\n      \"type\": \"judge\",\n      \"q\": \"无向图跑 Tarjan 时，必须跳过「沿着父亲那条边走回去」的情况。\",\n      \"answer\": true,\n      \"explain\": \"否则会把树边当成能更新的反向边，low 被算得过小，割点和桥都会判错。\"\n    },\n    {\n      \"id\": \"v08\",\n      \"type\": \"single\",\n      \"q\": \"求完强连通分量并「缩点」之后，得到的新图一定是？\",\n      \"options\": [\"树\", \"DAG（有向无环图）\", \"完全图\", \"二分图\"],\n      \"answer\": 1,\n      \"explain\": \"如果缩点后还有环，那些点本来就该在同一个 SCC 里，矛盾。所以缩点图必然是 DAG，可以放心在它上面做拓扑排序和 DP。\"\n    },\n    {\n      \"id\": \"v09\",\n      \"type\": \"single\",\n      \"q\": \"阅读以下描述，Tarjan 输出的强连通分量个数是？\",\n      \"code\": \"有向图，边：\\n1 -> 2\\n2 -> 3\\n3 -> 1\\n3 -> 4\",\n      \"options\": [\"1\", \"2\", \"3\", \"4\"],\n      \"answer\": 1,\n      \"explain\": \"{1,2,3} 互相可达成一个 SCC，4 出度为 0、自己一个 SCC，共 2 个。\"\n    },\n    {\n      \"id\": \"v10\",\n      \"type\": \"single\",\n      \"q\": \"当 dfn[u] == low[u] 时，说明什么？\",\n      \"options\": [\n        \"u 还没有被访问过\",\n        \"u 就是它所在强连通分量的「根」，此时可以把栈里的点弹出，组成一个 SCC\",\n        \"u 是图的割点\",\n        \"图里存在负环\"\n      ],\n      \"answer\": 1,\n      \"explain\": \"这是 Tarjan 弹栈的信号：u 往上回不到更早的点了，u 及其之后压入的点构成一个完整 SCC。\"\n    }\n  ],\n  \"hidden\": [\n    {\n      \"id\": \"h01\",\n      \"type\": \"single\",\n      \"q\": \"无向图中存在重边时，「跳过父亲节点」的写法会出问题，正确做法是？\",\n      \"options\": [\n        \"记录刚走过的那条边的编号，只跳过这一条边的反向边\",\n        \"把所有重边合并成一条\",\n        \"直接删掉重边\",\n        \"重边图不能用 Tarjan\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"两条 2-3 的边时，按「点」跳过父亲会把另一条也跳掉，low 算不对。按边编号跳过就只挡掉刚走来的那条。\"\n    },\n    {\n      \"id\": \"h02\",\n      \"type\": \"judge\",\n      \"q\": \"有向图求 SCC 时，用边 (u,v) 更新 low 需要额外判断 v「在栈中」；无向图求割点桥时不需要这个判断。\",\n      \"answer\": true,\n      \"explain\": \"有向图里指向一个已确定的 SCC 的边不能用来更新 low；无向图的树边结构保证不需要这个条件。\"\n    },\n    {\n      \"id\": \"h03\",\n      \"type\": \"single\",\n      \"q\": \"阅读以下描述，这个无向图的割点有几个？\",\n      \"code\": \"点：1 2 3 4\\n边：1-2, 2-3, 3-1, 2-4\",\n      \"options\": [\"0\", \"1\", \"2\", \"3\"],\n      \"answer\": 1,\n      \"explain\": \"1、2、3 成环，4 挂在 2 上。只有删掉 2 会把 4 单独隔出来，所以割点只有 1 个。\"\n    },\n    {\n      \"id\": \"h04\",\n      \"type\": \"multi\",\n      \"q\": \"关于 dfn 和 low，下列说法正确的有？\",\n      \"options\": [\n        \"dfn[u] 是 DFS 第一次访问到 u 的时间戳\",\n        \"low[u] 不会大于 dfn[u]\",\n        \"low[u] == dfn[u] 说明 u 是它所在强连通分量的根\",\n        \"low[u] 一定大于 dfn[父节点]\"\n      ],\n      \"answer\": [0, 1, 2],\n      \"explain\": \"low[u] 至少能取到自己，所以不会超过 dfn[u]；而它能小于等于父亲的 dfn，这正是割点和桥成立的原因。\"\n    },\n    {\n      \"id\": \"h05\",\n      \"type\": \"single\",\n      \"q\": \"Tarjan 里那个栈的作用是？\",\n      \"options\": [\n        \"保存 DFS 的路径，用于回溯时恢复现场\",\n        \"保存当前还没确定归属的节点，等 dfn==low 时弹出组成一个 SCC\",\n        \"保存已经访问完成的节点\",\n        \"用于记录最短路的前驱\"\n      ],\n      \"answer\": 1,\n      \"explain\": \"栈里的点都是「候选，但还没确定属于哪个 SCC」的点。用完了就弹出，保证每个点进出栈各一次。\"\n    }\n  ]\n}\n","bank/interval-dp.json":"{\n  \"id\": \"interval-dp\",\n  \"name\": \"区间 DP\",\n  \"desc\": \"区间合并、石子合并、括号匹配。\",\n  \"visible\": [\n    {\n      \"id\": \"v01\",\n      \"type\": \"single\",\n      \"q\": \"区间 DP 通常按什么顺序枚举？\",\n      \"options\": [\n        \"区间长度从小到大\",\n        \"区间长度从大到小\",\n        \"随机\",\n        \"左端点从大到小\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"短区间先计算。\"\n    },\n    {\n      \"id\": \"v02\",\n      \"type\": \"judge\",\n      \"q\": \"石子合并是经典区间 DP 问题。\",\n      \"answer\": true,\n      \"explain\": \"合并相邻两堆，代价为和。\"\n    },\n    {\n      \"id\": \"v03\",\n      \"type\": \"single\",\n      \"q\": \"区间 DP 状态 dp[l][r] 通常表示？\",\n      \"options\": [\n        \"区间 [l, r] 的最优值\",\n        \"前 l 个\",\n        \"前 r 个\",\n        \"l 到 r 的长度\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"表示该区间的最优解。\"\n    },\n    {\n      \"id\": \"v04\",\n      \"type\": \"judge\",\n      \"q\": \"区间 DP 转移通常枚举分割点 k。\",\n      \"answer\": true,\n      \"explain\": \"dp[l][r] = min/max(dp[l][k] + dp[k+1][r] + ...)。\"\n    },\n    {\n      \"id\": \"v05\",\n      \"type\": \"single\",\n      \"q\": \"括号匹配区间 DP 中，若 s[l] 与 s[r] 匹配，则？\",\n      \"options\": [\n        \"可以由 dp[l+1][r-1] 转移\",\n        \"直接返回 0\",\n        \"忽略\",\n        \"排序\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"两端匹配可包含内部最优。\"\n    },\n    {\n      \"id\": \"v06\",\n      \"type\": \"judge\",\n      \"q\": \"区间 DP 时间复杂度通常为 O(n^3)。\",\n      \"answer\": true,\n      \"explain\": \"枚举长度、左端点、分割点。\"\n    },\n    {\n      \"id\": \"v07\",\n      \"type\": \"single\",\n      \"q\": \"石子合并中，合并代价通常用？\",\n      \"options\": [\n        \"前缀和快速求区间和\",\n        \"哈希\",\n        \"并查集\",\n        \"最短路\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"sum[r] - sum[l-1]。\"\n    },\n    {\n      \"id\": \"v08\",\n      \"type\": \"judge\",\n      \"q\": \"区间 DP 可以处理环形问题。\",\n      \"answer\": true,\n      \"explain\": \"断环成链或复制一倍。\"\n    },\n    {\n      \"id\": \"v09\",\n      \"type\": \"single\",\n      \"q\": \"若区间 DP 求最小值，初始化通常为？\",\n      \"options\": [\n        \"无穷大\",\n        \"0\",\n        \"-1\",\n        \"1\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"便于取 min。\"\n    },\n    {\n      \"id\": \"v10\",\n      \"type\": \"judge\",\n      \"q\": \"区间 DP 中，dp[l][r] 只依赖更短区间。\",\n      \"answer\": true,\n      \"explain\": \"长度从小到大保证子区间已算。\"\n    }\n  ],\n  \"hidden\": [\n    {\n      \"id\": \"h01\",\n      \"type\": \"single\",\n      \"q\": \"石子合并若为环形，常用什么技巧？\",\n      \"options\": [\n        \"复制数组一倍\",\n        \"排序\",\n        \"哈希\",\n        \"拓扑排序\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"在长度 2n 上做区间 DP。\"\n    },\n    {\n      \"id\": \"h02\",\n      \"type\": \"judge\",\n      \"q\": \"区间 DP 的转移通常需要枚举断点。\",\n      \"answer\": true,\n      \"explain\": \"把大区间分成两个子区间。\"\n    },\n    {\n      \"id\": \"h03\",\n      \"type\": \"single\",\n      \"q\": \"括号匹配区间 DP 中，若不匹配，通常？\",\n      \"options\": [\n        \"枚举断点合并\",\n        \"直接返回 0\",\n        \"忽略\",\n        \"排序\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"分成两个子区间。\"\n    },\n    {\n      \"id\": \"h04\",\n      \"type\": \"single\",\n      \"q\": \"区间 DP 的空间复杂度通常是？\",\n      \"options\": [\n        \"O(n^2)\",\n        \"O(n)\",\n        \"O(1)\",\n        \"O(n log n)\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"二维状态。\"\n    },\n    {\n      \"id\": \"h05\",\n      \"type\": \"judge\",\n      \"q\": \"区间 DP 可以用于字符串消除问题。\",\n      \"answer\": true,\n      \"explain\": \"如消除回文子串等。\"\n    }\n  ]\n}\n","bank/kmp.json":"{\n  \"id\": \"kmp\",\n  \"name\": \"KMP 算法\",\n  \"desc\": \"前缀函数、失配指针、周期与 Border 性质。\",\n  \"visible\": [\n    {\n      \"id\": \"v01\",\n      \"type\": \"single\",\n      \"q\": \"KMP 算法主要解决什么问题？\",\n      \"options\": [\n        \"字符串模式匹配\",\n        \"最短路\",\n        \"排序\",\n        \"最小生成树\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"KMP 在线性时间内完成模式串匹配。\"\n    },\n    {\n      \"id\": \"v02\",\n      \"type\": \"judge\",\n      \"q\": \"KMP 的 next 数组也称为失配指针。\",\n      \"answer\": true,\n      \"explain\": \"失配时根据 next 数组跳转，避免主串指针回退。\"\n    },\n    {\n      \"id\": \"v03\",\n      \"type\": \"single\",\n      \"q\": \"前缀函数 pi[i] 表示？\",\n      \"options\": [\n        \"子串 s[0..i] 的最长真前后缀相等长度\",\n        \"字符串长度\",\n        \"字符个数\",\n        \"哈希值\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"即最长的 border 长度。\"\n    },\n    {\n      \"id\": \"v04\",\n      \"type\": \"judge\",\n      \"q\": \"KMP 匹配的时间复杂度是 O(n + m)。\",\n      \"answer\": true,\n      \"explain\": \"预处理 O(m)，匹配 O(n)。\"\n    },\n    {\n      \"id\": \"v05\",\n      \"type\": \"single\",\n      \"q\": \"失配时，KMP 通常将模式串指针移动到？\",\n      \"options\": [\n        \"next[j-1]\",\n        \"0\",\n        \"j+1\",\n        \"n\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"根据已匹配前缀的最长 border 跳转。\"\n    },\n    {\n      \"id\": \"v06\",\n      \"type\": \"judge\",\n      \"q\": \"KMP 中主串指针不会回退。\",\n      \"answer\": true,\n      \"explain\": \"主串指针一直向前，模式串指针根据 next 跳转。\"\n    },\n    {\n      \"id\": \"v07\",\n      \"type\": \"single\",\n      \"q\": \"若字符串长度为 n，最小循环节长度为？\",\n      \"options\": [\n        \"n - pi[n-1]\",\n        \"pi[n-1]\",\n        \"n / 2\",\n        \"n\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"若 n % (n - pi[n-1]) == 0，则为循环节长度。\"\n    },\n    {\n      \"id\": \"v08\",\n      \"type\": \"judge\",\n      \"q\": \"Border 是指既是前缀又是后缀的子串。\",\n      \"answer\": true,\n      \"explain\": \"真 Border 不包含自身。\"\n    },\n    {\n      \"id\": \"v09\",\n      \"type\": \"single\",\n      \"q\": \"KMP 预处理 next 数组的时间复杂度是？\",\n      \"options\": [\n        \"O(m)\",\n        \"O(n)\",\n        \"O(nm)\",\n        \"O(log m)\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"m 为模式串长度，线性预处理。\"\n    },\n    {\n      \"id\": \"v10\",\n      \"type\": \"judge\",\n      \"q\": \"KMP 可以用于求字符串的周期。\",\n      \"answer\": true,\n      \"explain\": \"利用前缀函数可判断周期和循环节。\"\n    }\n  ],\n  \"hidden\": [\n    {\n      \"id\": \"h01\",\n      \"type\": \"single\",\n      \"q\": \"KMP 中 next 数组的核心作用是？\",\n      \"options\": [\n        \"失配时快速跳转\",\n        \"排序\",\n        \"哈希\",\n        \"建图\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"利用已匹配信息避免重复比较。\"\n    },\n    {\n      \"id\": \"h02\",\n      \"type\": \"judge\",\n      \"q\": \"KMP 可以求出模式串在文本串中所有出现位置。\",\n      \"answer\": true,\n      \"explain\": \"匹配成功后继续按 next 跳转即可。\"\n    },\n    {\n      \"id\": \"h03\",\n      \"type\": \"single\",\n      \"q\": \"若 pi[n-1] = k，则字符串长度为 n 的前缀函数含义是？\",\n      \"options\": [\n        \"最 \"options\": [\n        \"同向双指针 + 哈希\",\n        \"相向双指针\",\n        \"二分答案\",\n        \"拓扑排序\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"右指针扩张，左指针收缩，维护窗口内无重复。\"\n    },\n    {\n      \"id\": \"h03\",\n      \"type\": \"judge\",\n      \"q\": \"双指针移动时，通常需要保证不会遗漏最优解。\",\n      \"answer\": true,\n      \"explain\": \"正确性关键在于证明被跳过的状态不可能更优。\"\n    },\n    {\n      \"id\": \"h04\",\n      \"type\": \"single\",\n      \"q\": \"三数之和为 0 的经典做法通常先做什么？\",\n      \"options\": [\n        \"排序后固定一个数，再双指针\",\n        \"直接三重循环\",\n        \"哈希所有数\",\n        \"建图跑最短路\"\n      ],\n      \"answer\": 0,\n      \"explain\": \"排序后枚举第一个数，剩下两数用相向双指针。\"\n    },\n    {\n      \"id\": \"h05\",\n      \"type\": \"judge\",\n      \"q\": \"双指针算法中，指针只能每次移动一步。\",\n      \"answer\": false,\n      \"explain\": \"指针可以跳着移动，只要整体复杂度与正确性满足要求。\"\n    }\n  ]\n}\n"}};
